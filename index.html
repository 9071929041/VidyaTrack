<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VidyaTrack - Classroom & Ledger OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #printReportArea, #printReportArea * { visibility: visible; }
      #printReportArea { position: absolute; left: 0; top: 0; width: 100%; padding: 20px; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen antialiased">
  <div id="app" class="max-w-xl mx-auto min-h-screen flex flex-col pb-24 sm:pb-12">
    <div class="p-8 text-center text-xs text-slate-400">Loading VidyaTrack OS...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://potwcgsmaogmnqbktftm.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvdHdjZ3NtYW9nbW5xYmt0ZnRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NTQ3OTIsImV4cCI6MjEwNDUzMDc5Mn0.8Tn1cVEbID48PvAOqztUY2sNDDrDBBgYH4V9zH1ksZ8";

    let sbClient = null;
    try {
      if (window.supabase) {
        sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {
      console.error("Supabase init error", e);
    }

    const app = document.getElementById("app");
    let currentUser = null;
    let currentUserRole = "admin";
    let currentTab = "fees";
    let isDarkMode = localStorage.getItem("vt_dark") === "true";
    let selectedAttendanceDate = new Date().toISOString().split('T')[0];
    let selectedRemarkLang = "English";
    let currentReportPayload = null;

    if (isDarkMode) document.documentElement.classList.add("dark");

    async function fetchUserRole(userId) {
      if (!sbClient) return "admin";
      try {
        const { data } = await sbClient.from("user_roles").select("role").eq("user_id", userId).maybeSingle();
        return data ? data.role : "admin";
      } catch {
        return "admin";
      }
    }

    function renderLoginView() {
      app.innerHTML = `
        <div class="flex-1 flex flex-col justify-center px-6 py-12">
          <div class="text-center mb-8">
            <div class="inline-flex p-3.5 bg-indigo-600 text-white rounded-2xl shadow-xl mb-3">
              <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"></path></svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">VidyaTrack</h1>
            <p class="text-xs text-slate-500 mt-1">Classroom Registry &amp; Ledger OS</p>
          </div>
          <form id="loginForm" class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Email</label>
              <input type="email" id="loginEmail" required class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="admin@vidyatrack.com" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Password</label>
              <input type="password" id="loginPassword" required class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••••••" />
            </div>
            <p id="authError" class="text-xs text-rose-500 hidden font-medium"></p>
            <button type="submit" id="loginBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm shadow-sm transition">Sign In</button>
          </form>
        </div>
      `;

      document.getElementById("loginForm").onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById("loginBtn");
        const err = document.getElementById("authError");
        btn.disabled = true; btn.innerText = "Signing in..."; err.classList.add("hidden");

        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;

        if (!sbClient) {
          err.innerText = "Database connection offline."; err.classList.remove("hidden");
          btn.disabled = false; btn.innerText = "Sign In";
          return;
        }

        const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
        if (error) {
          err.innerText = error.message; err.classList.remove("hidden");
          btn.disabled = false; btn.innerText = "Sign In";
        } else {
          currentUser = data.user;
          currentUserRole = await fetchUserRole(currentUser.id);
          renderMainShell();
          loadTabContent();
        }
      };
    }

    function renderMainShell() {
      app.innerHTML = `
        <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur border-b border-slate-200 dark:border-slate-800 px-4 py-3 sticky top-0 z-30 flex justify-between items-center no-print">
          <div class="flex items-center gap-2">
            <div class="p-1.5 bg-indigo-600 text-white rounded-lg">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"></path></svg>
            </div>
            <div>
              <h2 class="text-base font-bold text-slate-900 dark:text-white leading-tight">VidyaTrack</h2>
              <span class="text-[9px] uppercase tracking-wider font-extrabold px-1.5 py-0.2 rounded border bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300 border-amber-300">
                ${currentUserRole}
              </span>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="toggleDarkMode()" class="p-2 text-slate-500 rounded-lg text-xs">${isDarkMode ? '☀️' : '🌙'}</button>
            <button onclick="handleLogout()" class="text-xs px-2.5 py-1 bg-rose-50 text-rose-600 dark:bg-rose-950/40 dark:text-rose-400 rounded-lg font-medium">Exit</button>
          </div>
        </header>

        <main id="tabContent" class="flex-1 p-4 overflow-y-auto"></main>
        <div id="modalSlot"></div>

        <nav class="fixed bottom-0 left-0 right-0 max-w-xl mx-auto bg-white/95 dark:bg-slate-900/95 backdrop-blur border-t border-slate-200 dark:border-slate-800 px-1 py-1.5 flex justify-between items-center z-30 no-print">
          ${navButton('fees', 'Fees', '💰')}
          ${navButton('students', 'Students', '👨‍🎓')}
          ${navButton('attendance', 'Attendance', '📅')}
          ${navButton('academics', 'Marks', '📝')}
          ${navButton('reports', 'Reports', '📊')}
        </nav>
      `;
    }

    function navButton(tabId, label, icon) {
      const active = currentTab === tabId;
      return `
        <button onclick="switchTab('${tabId}')" class="flex-1 flex flex-col items-center py-1 rounded-xl transition ${active ? 'text-indigo-600 font-bold dark:text-indigo-400' : 'text-slate-400 hover:text-slate-600'}">
          <span class="text-base">${icon}</span>
          <span class="text-[9px] mt-0.5">${label}</span>
        </button>
      `;
    }

    window.switchTab = (tabId) => {
      currentTab = tabId;
      renderMainShell();
      loadTabContent();
    };

    window.toggleDarkMode = () => {
      isDarkMode = !isDarkMode;
      localStorage.setItem("vt_dark", isDarkMode);
      document.documentElement.classList.toggle("dark", isDarkMode);
      renderMainShell();
      loadTabContent();
    };

    window.handleLogout = async () => {
      if (sbClient) await sbClient.auth.signOut();
      currentUser = null;
      renderLoginView();
    };

    async function loadTabContent() {
      const content = document.getElementById("tabContent");
      if (!content) return;
      content.innerHTML = `<div class="py-20 text-center text-xs text-slate-400 animate-pulse">Loading module...</div>`;

      if (currentTab === "fees") await renderFeesTab(content);
      if (currentTab === "students") await renderStudentsTab(content);
      if (currentTab === "attendance") await renderAttendanceTab(content);
      if (currentTab === "academics") await renderAcademicsTab(content);
      if (currentTab === "reports") await renderReportsTab(content);
    }

    // FEES TAB
    async function renderFeesTab(container) {
      const currentMonth = new Date().toISOString().slice(0, 7);
      const { data: fees } = await sbClient.from("fees").select("*, students(name, student_id, parent_mobile, parent_name, grade_class)").order("created_at", { ascending: false });

      const totalBilled = (fees || []).reduce((acc, f) => acc + parseFloat(f.amount_due || 0), 0);
      const totalCollected = (fees || []).reduce((acc, f) => acc + parseFloat(f.amount_paid || 0), 0);
      const totalPending = totalBilled - totalCollected;

      container.innerHTML = `
        <div class="space-y-4">
          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800">
              <p class="text-[10px] text-slate-400 font-bold uppercase">Billed</p>
              <p class="text-xs font-extrabold text-slate-800 dark:text-white mt-0.5">₹${totalBilled.toLocaleString("en-IN")}</p>
            </div>
            <div class="bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800">
              <p class="text-[10px] text-slate-400 font-bold uppercase">Collected</p>
              <p class="text-xs font-extrabold text-emerald-600 mt-0.5">₹${totalCollected.toLocaleString("en-IN")}</p>
            </div>
            <div class="bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800">
              <p class="text-[10px] text-slate-400 font-bold uppercase">Pending</p>
              <p class="text-xs font-extrabold text-rose-600 mt-0.5">₹${totalPending.toLocaleString("en-IN")}</p>
            </div>
          </div>

          <div class="flex justify-between items-center">
            <h3 class="text-xs font-bold uppercase text-slate-400">Ledger Statements</h3>
            <button onclick="generateMonthlyDues()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-xs">⚡ Generate Invoices (${currentMonth})</button>
          </div>

          <div class="space-y-2">
            ${(!fees || fees.length === 0) ? `
              <div class="p-8 text-center text-xs text-slate-400 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800">No fee statements found.</div>
            ` : fees.map(f => {
              const balance = parseFloat(f.amount_due) - parseFloat(f.amount_paid);
              const student = f.students || {};
              const isPaid = f.status === 'Paid';
              return `
                <div class="bg-white dark:bg-slate-900 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-xs space-y-2.5">
                  <div class="flex justify-between items-start">
                    <div>
                      <h4 class="text-xs font-bold text-slate-800 dark:text-slate-100">${student.name || 'Unknown'}</h4>
                      <p class="text-[10px] text-slate-400 font-mono">${student.grade_class || ''} • Cycle: ${f.month_year}</p>
                    </div>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${isPaid ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}">${f.status}</span>
                  </div>
                  <div class="flex justify-between items-center text-xs pt-1 border-t border-slate-100 dark:border-slate-800">
                    <div>
                      <span class="font-extrabold text-slate-800 dark:text-slate-200">₹${parseFloat(f.amount_paid).toLocaleString("en-IN")}</span>
                      <span class="text-[11px] text-slate-400">/ ₹${parseFloat(f.amount_due).toLocaleString("en-IN")}</span>
                    </div>
                    <div class="flex gap-1.5">
                      ${!isPaid ? `<button onclick="openPaymentModal('${f.id}', ${f.amount_due}, ${f.amount_paid})" class="px-2.5 py-1 bg-indigo-600 text-white rounded-lg text-[10px] font-bold">Collect</button>` : ''}
                      <button onclick="sendWhatsAppNotice('${student.name || ''}', '${student.parent_mobile || ''}', '${student.parent_name || ''}', '${f.month_year}', ${f.amount_due}, ${f.amount_paid}, '${f.receipt_no || ''}', '${f.status}')" class="px-2 py-1 bg-emerald-500 text-white rounded-lg text-[10px] font-bold">💬 WhatsApp</button>
                    </div>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    window.openPaymentModal = (feeId, amountDue, amountPaid) => {
      const balance = amountDue - amountPaid;
      const slot = document.getElementById("modalSlot");
      const modal = document.createElement("div");
      modal.className = "fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4";
      modal.innerHTML = `
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 w-full max-w-xs space-y-3 shadow-xl">
          <h3 class="text-xs font-bold uppercase">Record Fee Payment</h3>
          <p class="text-xs text-slate-400">Due: <strong class="text-rose-500">₹${balance.toLocaleString("en-IN")}</strong></p>
          <form id="payForm" class="space-y-3 text-xs">
            <input type="number" id="payAmount" min="1" max="${balance}" value="${balance}" required class="w-full p-2 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 font-bold" />
            <div class="flex gap-2">
              <button type="button" onclick="this.closest('.fixed').remove()" class="flex-1 py-2 bg-slate-100 rounded-xl font-bold">Cancel</button>
              <button type="submit" class="flex-1 py-2 bg-indigo-600 text-white rounded-xl font-bold">Save</button>
            </div>
          </form>
        </div>
      `;
      slot.appendChild(modal);

      modal.querySelector("#payForm").onsubmit = async (e) => {
        e.preventDefault();
        const collected = parseFloat(document.getElementById("payAmount").value);
        const newPaid = amountPaid + collected;
        const newStatus = newPaid >= amountDue ? 'Paid' : 'Partial';

        await sbClient.from("fees").update({ amount_paid: newPaid, status: newStatus, receipt_no: "REC-" + Date.now().toString().slice(-4), paid_at: new Date().toISOString() }).eq("id", feeId);
        modal.remove();
        loadTabContent();
      };
    };

    window.sendWhatsAppNotice = (name, mobile, parent, cycle, due, paid, receiptNo, status) => {
      if (!mobile) return alert("No mobile number found.");
      const clean = mobile.replace(/[^0-9]/g, "").slice(-10);
      const msg = status === "Paid" 
        ? `*VIDYATRACK RECEIPT*\nStudent: ${name}\nCycle: ${cycle}\nReceived: ₹${paid} (Fully Paid)`
        : `*VIDYATRACK REMINDER*\nStudent: ${name}\nCycle: ${cycle}\nDue: ₹${due - paid}`;
      window.open(`https://wa.me/91${clean}?text=${encodeURIComponent(msg)}`, "_blank");
    };

    window.generateMonthlyDues = async () => {
      const monthYear = prompt("Billing cycle (YYYY-MM):", new Date().toISOString().slice(0, 7));
      if (!monthYear) return;
      const { data: students } = await sbClient.from("students").select("id, monthly_fee").eq("is_active", true);
      if (!students || students.length === 0) return alert("No students found.");
      const records = students.map(s => ({ student_id: s.id, month_year: monthYear, amount_due: s.monthly_fee || 0, amount_paid: 0, status: 'Pending' }));
      await sbClient.from("fees").upsert(records, { onConflict: "student_id,month_year" });
      loadTabContent();
    };

    // STUDENTS TAB
    async function renderStudentsTab(container) {
      const { data: students } = await sbClient.from("students").select("*").order("name");
      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex justify-between items-center">
            <h3 class="text-xs font-bold uppercase text-slate-400">Students (${students?.length || 0})</h3>
            <button onclick="openAddStudentModal()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold">+ New Student</button>
          </div>
          <div class="space-y-2">
            ${(students || []).map(s => `
              <div class="bg-white dark:bg-slate-900 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 flex justify-between items-center">
                <div>
                  <h4 class="font-bold text-xs">${s.name}</h4>
                  <p class="text-[10px] text-slate-400">${s.grade_class} • ₹${s.monthly_fee}/mo • ${s.parent_mobile || ''}</p>
                </div>
                <button onclick="deleteStudent('${s.id}')" class="text-rose-500 text-xs p-1">🗑️</button>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    window.openAddStudentModal = () => {
      const slot = document.getElementById("modalSlot");
      const modal = document.createElement("div");
      modal.className = "fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4";
      modal.innerHTML = `
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 w-full max-w-sm space-y-3">
          <h3 class="text-xs font-bold uppercase">Enroll Student</h3>
          <form id="newStudentForm" class="space-y-2 text-xs">
            <input type="text" name="name" placeholder="Full Name" required class="w-full p-2 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700" />
            <input type="text" name="grade_class" placeholder="Class / Grade" required class="w-full p-2 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700" />
            <input type="text" name="parent_name" placeholder="Parent Name" required class="w-full p-2 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700" />
            <input type="tel" name="parent_mobile" placeholder="Mobile (10 digits)" required class="w-full p-2 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700" />
            <input type="number" name="monthly_fee" placeholder="Monthly Fee (₹)" required class="w-full p-2 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700" />
            <div class="flex gap-2 pt-1">
              <button type="button" onclick="this.closest('.fixed').remove()" class="flex-1 py-2 bg-slate-100 rounded-xl font-bold">Cancel</button>
              <button type="submit" class="flex-1 py-2 bg-indigo-600 text-white rounded-xl font-bold">Save</button>
            </div>
          </form>
        </div>
      `;
      slot.appendChild(modal);

      modal.querySelector("#newStudentForm").onsubmit = async (e) => {
        e.preventDefault();
        const payload = Object.fromEntries(new FormData(e.target).entries());
        payload.student_id = "STU-" + Date.now().toString().slice(-4);
        payload.is_active = true;
        await sbClient.from("students").insert([payload]);
        modal.remove();
       loadTabContent();
      };
    };

    window.deleteStudent = async (id) => {
      if (!confirm("Delete this student?")) return;
      await sbClient.from("students").delete().eq("id", id);
      loadTabContent();
    };

    // ATTENDANCE TAB
    async function renderAttendanceTab(container) {
      const { data: students } = await sbClient.from("students").select("*").eq("is_active", true).order("name");
      const { data: records } = await sbClient.from("attendance").select("*").eq("record_date", selectedAttendanceDate);

      const attendanceMap = {};
      (records || []).forEach(r => { attendanceMap[r.student_id] = r.status; });

      container.innerHTML = `
        <div class="space-y-4">
          <div class="bg-white dark:bg-slate-900 p-3 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-xs flex items-center justify-between">
            <div>
              <span class="text-[10px] font-bold text-slate-400 uppercase block">Attendance Date</span>
              <span class="text-xs font-bold text-indigo-600 font-mono">${selectedAttendanceDate}</span>
            </div>
            <input type="date" value="${selectedAttendanceDate}" onchange="changeAttendanceDate(this.value)" class="text-xs font-bold p-1.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl" />
          </div>

          <div class="space-y-2">
            ${(students || []).map(s => {
              const currentStatus = attendanceMap[s.id] || "Unmarked";
              return `
                <div class="bg-white dark:bg-slate-900 p-3 rounded-2xl border border-slate-200 dark:border-slate-800 flex justify-between items-center">
                  <div>
                    <h4 class="font-bold text-xs">${s.name}</h4>
                    <p class="text-[10px] text-slate-400">${s.grade_class} • Status: <strong class="${currentStatus === 'Present' ? 'text-emerald-600' : 'text-rose-600'}">${currentStatus}</strong></p>
                  </div>
                  <div class="flex gap-1.5">
                    <button onclick="setAttendance('${s.id}', 'Present')" class="px-2.5 py-1 rounded-xl text-[10px] font-bold ${currentStatus === 'Present' ? 'bg-emerald-600 text-white' : 'bg-slate-100 dark:bg-slate-800'}">✅</button>
                    <button onclick="setAttendance('${s.id}', 'Absent')" class="px-2.5 py-1 rounded-xl text-[10px] font-bold ${currentStatus === 'Absent' ? 'bg-rose-600 text-white' : 'bg-slate-100 dark:bg-slate-800'}">❌</button>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    window.changeAttendanceDate = (newDate) => {
      selectedAttendanceDate = newDate;
      loadTabContent();
    };

    window.setAttendance = async (studentId, status) => {
      await sbClient.from("attendance").upsert({ student_id: studentId, record_date: selectedAttendanceDate, status: status }, { onConflict: 'student_id,record_date' });
      loadTabContent();
    };

    // ACADEMICS TAB
    async function renderAcademicsTab(container) {
      const { data: marks } = await sbClient.from("test_marks").select("*, students(name, grade_class)").order("created_at", { ascending: false });
      const testGroups = {};
      (marks || []).forEach(m => {
        const key = `${m.student_id}_${m.test_name}`;
        if (!testGroups[key]) testGroups[key] = { studentName: m.students?.name || 'Unknown', gradeClass: m.students?.grade_class || '', testName: m.test_name, subjects: [] };
        testGroups[key].subjects.push(m);
      });

      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex justify-between items-center">
            <h3 class="text-xs font-bold uppercase text-slate-400">Test Marks</h3>
            <button onclick="openAddTestMarksModal()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold">+ Add Marks</button>
          </div>
          <div class="space-y-3">
            ${Object.values(testGroups).map(t => {
              const totalObtained = t.subjects.reduce((sum, s) => sum + parseFloat(s.obtained_score || 0), 0);
              const totalMax = t.subjects.reduce((sum, s) => sum + parseFloat(s.max_score || 100), 0);
              const pct = totalMax > 0 ? ((totalObtained / totalMax) * 100).toFixed(1) : 0;

              return `
                <div class="bg-white dark:bg-slate-900 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-2">
                  <div class="flex justify-between items-start border-b border-slate-100 dark:border-slate-800 pb-1.5">
                    <div>
                      <h4 class="text-xs font-bold">${t.testName}</h4>
                      <p class="text-[10px] text-slate-400">${t.studentName} (${t.gradeClass})</p>
                    </div>
                    <span class="text-xs font-bold text-indigo-600">${pct}% (${totalObtained}/${totalMax})</span>
                  </div>
                  <div class="text-[11px] space-y-1">
                    ${t.subjects.map(s => `<div class="flex justify-between text-slate-600 dark:text-slate-300"><span>${s.subject}</span><span class="font-bold">${s.obtained_score}/${s.max_score}</span></div>`).join("")}
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    window.openAddTestMarksModal = async () => {
      const slot = document.getElementById("modalSlot");
      const { data: students } = await sbClient.from("students").select("id, name, grade_class").eq("is_active", true).order("name");
      if (!students || students.length === 0) return alert("Add students first.");

      const modal = document.createElement("div");
      modal.id = "testModal";
      modal.className = "fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-3";
      modal.innerHTML = `
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 w-full max-w-md space-y-3">
          <h3 class="text-xs font-bold uppercase">Add Test Marks</h3>
          <form id="marksForm" onsubmit="saveTestMarks(event)" class="space-y-2.5 text-xs">
            <select id="mStudentId" class="w-full p-2 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">
              ${students.map(s => `<option value="${s.id}">${s.name} (${s.grade_class})</option>`).join("")}
            </select>
            <input type="text" id="mTestName" placeholder="Test Name (e.g. Unit Test 1)" required class="w-full p-2 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700" />
            <input type="date" id="mTestDate" value="${selectedAttendanceDate}" required class="w-full p-2 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700" />
            
            <div id="subjectRows" class="space-y-2 border-t border-slate-100 dark:border-slate-800 pt-2">
              <div class="flex gap-1.5 sub-row">
                <input type="text" placeholder="Subject" required class="flex-1 p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 dark:bg-slate-800" />
                <input type="number" placeholder="Score" required class="w-16 p-1.5 text-center font-bold rounded-lg border border-slate-200 dark:border-slate-700 dark:bg-slate-800" />
                <input type="number" placeholder="Max" value="100" required class="w-16 p-1.5 text-center rounded-lg border border-slate-200 dark:border-slate-700 dark:bg-slate-800" />
              </div>
            </div>

            <button type="button" onclick="addMarkSubjectRow()" class="text-indigo-600 text-[10px] font-bold">+ Add Another Subject</button>
            <div class="flex gap-2 pt-2 border-t border-slate-100 dark:border-slate-800">
              <button type="button" onclick="this.closest('#testModal').remove()" class="flex-1 py-2 bg-slate-100 rounded-xl font-bold">Cancel</button>
              <button type="submit" class="flex-1 py-2 bg-indigo-600 text-white rounded-xl font-bold">Save</button>
            </div>
          </form>
        </div>
      `;
      slot.innerHTML = '';
      slot.appendChild(modal);
    };

    window.addMarkSubjectRow = () => {
      const container = document.getElementById("subjectRows");
      const row = document.createElement("div");
      row.className = "flex gap-1.5 sub-row";
      row.innerHTML = `
        <input type="text" placeholder="Subject" required class="flex-1 p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 dark:bg-slate-800" />
        <input type="number" placeholder="Score" required class="w-16 p-1.5 text-center font-bold rounded-lg border border-slate-200 dark:border-slate-700 dark:bg-slate-800" />
        <input type="number" placeholder="Max" value="100" required class="w-16 p-1.5 text-center rounded-lg border border-slate-200 dark:border-slate-700 dark:bg-slate-800" />
      `;
      container.appendChild(row);
    };

    window.saveTestMarks = async (e) => {
      e.preventDefault();
      const studentId = document.getElementById("mStudentId").value;
      const testName = document.getElementById("mTestName").value.trim();
      const testDate = document.getElementById("mTestDate").value;

      const records = [];
      document.querySelectorAll(".sub-row").forEach(r => {
        const inputs = r.querySelectorAll("input");
        records.push({
          student_id: studentId,
          test_name: testName,
          test_date: testDate,
          subject: inputs[0].value.trim(),
          obtained_score: parseFloat(inputs[1].value) || 0,
          max_score: parseFloat(inputs[2].value) || 100,
          min_score: 35
        });
      });

      await sbClient.from("test_marks").upsert(records, { onConflict: "student_id,test_name,subject" });
      document.getElementById("testModal")?.remove();
      loadTabContent();
    };

    // REPORTS TAB
    async function renderReportsTab(container) {
      const { data: students } = await sbClient.from("students").select("id, name, grade_class").eq("is_active", true).order("name");

      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex justify-between items-center no-print">
            <h3 class="text-xs font-bold uppercase text-slate-400">Student Progress Reports</h3>
          </div>

          <div class="bg-white dark:bg-slate-900 p-3 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-xs flex flex-wrap gap-2 items-center no-print">
            <select id="reportStudentSelect" class="flex-1 p-2 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 text-xs outline-none">
              ${(students || []).map(s => `<option value="${s.id}">${s.name} (${s.grade_class})</option>`).join("")}
            </select>
            <button onclick="renderSelectedReport()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-xs">Generate</button>
          </div>

          <div id="reportSheetContainer"></div>
        </div>
      `;

      if (students && students.length > 0) renderSelectedReport();
    }

    window.renderSelectedReport = async () => {
      const sel = document.getElementById("reportStudentSelect");
      const target = document.getElementById("reportSheetContainer");
      if (!sel || !sel.value) return;

      const studentId = sel.value;
      target.innerHTML = `<div class="py-12 text-center text-xs text-slate-400 animate-pulse">Aggregating records...</div>`;

      const { data: student } = await sbClient.from("students").select("*").eq("id", studentId).single();
      const { data: fees } = await sbClient.from("fees").select("*").eq("student_id", studentId);
      const totalBilled = (fees || []).reduce((sum, f) => sum + parseFloat(f.amount_due || 0), 0);
      const totalPaid = (fees || []).reduce((sum, f) => sum + parseFloat(f.amount_paid || 0), 0);
      const feeBalance = totalBilled - totalPaid;

      target.innerHTML = `
        <div id="printReportArea" class="bg-white text-slate-900 p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4">
          <div class="text-center border-b pb-2">
            <h1 class="text-base font-extrabold uppercase">${student ? student.name : 'Student'}</h1>
            <p class="text-xs text-slate-500">${student ? student.grade_class : ''}</p>
          </div>
          <div class="flex justify-between text-xs">
            <div><p class="text-slate-400 text-[10px]">Fee Standing</p><p class="font-bold">₹${feeBalance} Due</p></div>
            <div class="text-right"><p class="text-slate-400 text-[10px]">Paid</p><p class="font-bold text-emerald-600">₹${totalPaid}</p></div>
          </div>
          <button onclick="window.print()" class="w-full py-2 bg-slate-900 text-white rounded-xl text-xs font-bold no-print">Print / PDF</button>
        </div>
      `;
    };
 // DIRECT INITIALIZATION - NEVER WAITS OR HANGS
    function startApp() {
      // 1. Immediately render the login form to kill any stuck loading screen
      renderLoginView();

      // 2. Check if a valid session already exists in the background
      if (sbClient && sbClient.auth) {
        sbClient.auth.getSession().then(async ({ data }) => {
          if (data && data.session && data.session.user) {
            currentUser = data.session.user;
            currentUserRole = await fetchUserRole(currentUser.id);
            renderMainShell();
            loadTabContent();
          }
        }).catch((e) => {
          console.log("No active session", e);
        });
      }
    }

    startApp();
  </script>
</body>
</html>
