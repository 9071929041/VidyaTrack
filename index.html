<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VidyaTrack - Classroom & Ledger OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: absolute; left: 0; top: 0; width: 100%; padding: 20px; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen antialiased">
  <div id="app" class="max-w-xl mx-auto min-h-screen flex flex-col pb-20 sm:pb-8">
    <div class="p-8 text-center text-xs text-slate-400">Booting VidyaTrack...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://potwcgsmaogmnqbktftm.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvdHdjZ3NtYW9nbW5xYmt0ZnRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NTQ3OTIsImV4cCI6MjEwNDUzMDc5Mn0.8Tn1cVEbID48PvAOqztUY2sNDDrDBBgYH4V9zH1ksZ8";

    let sbClient = null;
    try {
      if (window.supabase) sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (e) { console.error("Supabase init error", e); }

    const app = document.getElementById("app");
    let currentUser = null;
    let currentUserRole = "admin";
    let currentTab = "fees";
    let isDarkMode = localStorage.getItem("vt_dark") === "true";

    if (isDarkMode) document.documentElement.classList.add("dark");

    async function fetchUserRole(userId) {
      if (!sbClient) return "admin";
      try {
        const { data } = await sbClient.from("user_roles").select("role").eq("user_id", userId).maybeSingle();
        return data ? data.role : "admin";
      } catch { return "admin"; }
    }

    function renderLoginView() {
      app.innerHTML = `
        <div class="flex-1 flex flex-col justify-center px-6 py-12">
          <div class="text-center mb-8">
            <div class="inline-flex p-3.5 bg-indigo-600 text-white rounded-2xl shadow-xl mb-3">
              <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"></path></svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">VidyaTrack</h1>
            <p class="text-xs text-slate-500 mt-1">Classroom Registry &amp; Ledger OS</p>
          </div>
          <form id="loginForm" class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Email</label>
              <input type="email" id="loginEmail" required class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="admin@vidyatrack.com" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Password</label>
              <input type="password" id="loginPassword" required class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••••••" />
            </div>
            <p id="authError" class="text-xs text-rose-500 hidden font-medium"></p>
            <button type="submit" id="loginBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm shadow-sm transition">Sign In</button>
          </form>
        </div>
      `;

      document.getElementById("loginForm").onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById("loginBtn");
        const err = document.getElementById("authError");
        btn.disabled = true; btn.innerText = "Signing in..."; err.classList.add("hidden");

        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;

        const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
        if (error) {
          err.innerText = error.message; err.classList.remove("hidden");
          btn.disabled = false; btn.innerText = "Sign In";
        } else {
          currentUser = data.user;
          currentUserRole = await fetchUserRole(currentUser.id);
          renderMainShell();
          loadTabContent();
        }
      };
    }

    function renderMainShell() {
      app.innerHTML = `
        <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur border-b border-slate-200 dark:border-slate-800 px-4 py-3 sticky top-0 z-30 flex justify-between items-center no-print">
          <div class="flex items-center gap-2">
            <div class="p-1.5 bg-indigo-600 text-white rounded-lg">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"></path></svg>
            </div>
            <div>
              <h2 class="text-base font-bold text-slate-900 dark:text-white leading-tight">VidyaTrack</h2>
              <span class="text-[9px] uppercase tracking-wider font-extrabold px-1.5 py-0.2 rounded border bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300 border-amber-300">
                ${currentUserRole}
              </span>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="toggleDarkMode()" class="p-2 text-slate-500 rounded-lg text-xs">${isDarkMode ? '☀️' : '🌙'}</button>
            <button onclick="handleLogout()" class="text-xs px-2.5 py-1 bg-rose-50 text-rose-600 dark:bg-rose-950/40 dark:text-rose-400 rounded-lg font-medium">Exit</button>
          </div>
        </header>

        <main id="tabContent" class="flex-1 p-4 overflow-y-auto"></main>
        <div id="modalSlot"></div>

        <nav class="fixed bottom-0 left-0 right-0 max-w-xl mx-auto bg-white/95 dark:bg-slate-900/95 backdrop-blur border-t border-slate-200 dark:border-slate-800 px-2 py-1.5 flex justify-around items-center z-30 no-print">
          ${navButton('fees', 'Fees Ledger', '💰')}
          ${navButton('students', 'Students & Academics', '👨‍🎓')}
        </nav>
      `;
    }

    function navButton(tabId, label, icon) {
      const active = currentTab === tabId;
      return `
        <button onclick="switchTab('${tabId}')" class="flex flex-col items-center py-1 px-4 rounded-xl transition ${active ? 'text-indigo-600 font-bold dark:text-indigo-400' : 'text-slate-400 hover:text-slate-600'}">
          <span class="text-base">${icon}</span>
          <span class="text-[10px] mt-0.5">${label}</span>
        </button>
      `;
    }

    window.switchTab = (tabId) => {
      currentTab = tabId;
      renderMainShell();
      loadTabContent();
    };

    window.toggleDarkMode = () => {
      isDarkMode = !isDarkMode;
      localStorage.setItem("vt_dark", isDarkMode);
      document.documentElement.classList.toggle("dark", isDarkMode);
      renderMainShell();
      loadTabContent();
    };

    window.handleLogout = async () => {
      if (sbClient) await sbClient.auth.signOut();
      currentUser = null;
      renderLoginView();
    };

    async function loadTabContent() {
      const content = document.getElementById("tabContent");
      if (!content) return;
      content.innerHTML = `<div class="py-20 text-center text-xs text-slate-400 animate-pulse">Loading records...</div>`;

      if (currentTab === "fees") await renderFeesTab(content);
      if (currentTab === "students") await renderStudentsTab(content);
    }

    // ==========================================
    // 1. FEES LEDGER & AUTOMATION
    // ==========================================
    async function renderFeesTab(container) {
      const currentMonth = new Date().toISOString().slice(0, 7);

      const { data: fees, error } = await sbClient
        .from("fees")
        .select("*, students(name, student_id, parent_mobile, parent_name, grade_class)")
        .order("created_at", { ascending: false });

      if (error) {
        container.innerHTML = `<div class="p-4 bg-rose-50 text-rose-600 text-xs rounded-xl font-mono">${error.message}</div>`;
        return;
      }

      const totalBilled = (fees || []).reduce((acc, f) => acc + parseFloat(f.amount_due || 0), 0);
      const totalCollected = (fees || []).reduce((acc, f) => acc + parseFloat(f.amount_paid || 0), 0);
      const totalPending = totalBilled - totalCollected;

      container.innerHTML = `
        <div class="space-y-4">
          <!-- Summary Counters -->
          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800">
              <p class="text-[10px] text-slate-400 font-bold uppercase">Billed</p>
              <p class="text-xs font-extrabold text-slate-800 dark:text-white mt-0.5">₹${totalBilled.toLocaleString("en-IN")}</p>
            </div>
            <div class="bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800">
              <p class="text-[10px] text-slate-400 font-bold uppercase">Collected</p>
              <p class="text-xs font-extrabold text-emerald-600 mt-0.5">₹${totalCollected.toLocaleString("en-IN")}</p>
            </div>
            <div class="bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800">
              <p class="text-[10px] text-slate-400 font-bold uppercase">Pending</p>
              <p class="text-xs font-extrabold text-rose-600 mt-0.5">₹${totalPending.toLocaleString("en-IN")}</p>
            </div>
          </div>

          <!-- Actions Header -->
          <div class="flex justify-between items-center">
            <h3 class="text-xs font-bold uppercase text-slate-400">Ledger Statements</h3>
            <button onclick="generateMonthlyDues()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-xs">
              ⚡ Generate Invoices (${currentMonth})
            </button>
          </div>

          <!-- Ledger List -->
          <div class="space-y-2">
            ${(!fees || fees.length === 0) ? `
              <div class="p-8 text-center text-xs text-slate-400 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800">
                No fee statements found. Tap "Generate Invoices" above.
              </div>
            ` : fees.map(f => {
              const balance = parseFloat(f.amount_due) - parseFloat(f.amount_paid);
              const student = f.students || {};
              const isPaid = f.status === 'Paid';

              return `
                <div class="bg-white dark:bg-slate-900 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-xs space-y-2.5">
                  <div class="flex justify-between items-start">
                    <div>
                      <h4 class="text-xs font-bold text-slate-800 dark:text-slate-100">${student.name || 'Unknown'}</h4>
                      <p class="text-[10px] text-slate-400 font-mono">${student.grade_class || ''} • Cycle: ${f.month_year}</p>
                    </div>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${
                      isPaid ? 'bg-emerald-50 text-emerald-600 dark:bg-emerald-950/50' : 
                      f.status === 'Partial' ? 'bg-amber-50 text-amber-600 dark:bg-amber-950/50' : 
                      'bg-rose-50 text-rose-600 dark:bg-rose-950/50'
                    }">
                      ${f.status}
                    </span>
                  </div>

                  <div class="flex justify-between items-center text-xs pt-1 border-t border-slate-100 dark:border-slate-800">
                    <div>
                      <span class="font-extrabold text-slate-800 dark:text-slate-200">₹${parseFloat(f.amount_paid).toLocaleString("en-IN")}</span>
                      <span class="text-[11px] text-slate-400">/ ₹${parseFloat(f.amount_due).toLocaleString("en-IN")}</span>
                      ${balance > 0 ? `<span class="block text-[10px] text-rose-500 font-bold">Due: ₹${balance.toLocaleString("en-IN")}</span>` : ''}
                    </div>

                    <div class="flex gap-1.5 items-center">
                      ${!isPaid ? `
                        <button onclick="openPaymentModal('${f.id}', ${f.amount_due}, ${f.amount_paid})" class="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-[10px] font-bold">
                          Collect
                        </button>
                      ` : ''}

                      <button onclick="sendWhatsAppNotice('${student.name || ''}', '${student.parent_mobile || ''}', '${student.parent_name || ''}', '${f.month_year}', ${f.amount_due}, ${f.amount_paid}, '${f.receipt_no || ''}', '${f.status}')" class="px-2 py-1 bg-emerald-500 hover:bg-emerald-600 text-white rounded-lg text-[10px] font-bold flex items-center gap-1">
                        <span>💬</span> ${isPaid ? 'Receipt' : 'Reminder'}
                      </button>
                    </div>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    window.openPaymentModal = (feeId, amountDue, amountPaid) => {
      const balance = amountDue - amountPaid;
      const slot = document.getElementById("modalSlot");
      const modal = document.createElement("div");
      modal.className = "fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4";

      modal.innerHTML = `
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 w-full max-w-xs space-y-3 shadow-xl">
          <h3 class="text-xs font-bold text-slate-800 dark:text-white uppercase tracking-wider">Record Fee Payment</h3>
          <p class="text-xs text-slate-400">Remaining Due: <strong class="text-rose-500">₹${balance.toLocaleString("en-IN")}</strong></p>
          
          <form id="payForm" class="space-y-3 text-xs">
            <div>
              <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Payment Amount (₹) *</label>
              <input type="number" id="payAmount" min="1" max="${balance}" value="${balance}" required class="w-full p-2 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 font-bold text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Payment Mode</label>
              <select id="payMode" class="w-full p-2 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 outline-none">
                <option value="Cash">Cash</option>
                <option value="UPI">UPI (GPay / PhonePe)</option>
                <option value="Bank Transfer">Bank Transfer / IMPS</option>
              </select>
            </div>
            <div class="flex gap-2 pt-1">
              <button type="button" onclick="this.closest('.fixed').remove()" class="flex-1 py-2 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 rounded-xl font-bold">Cancel</button>
              <button type="submit" class="flex-1 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold">Save Receipt</button>
            </div>
          </form>
        </div>
      `;
      slot.appendChild(modal);

      modal.querySelector("#payForm").onsubmit = async (e) => {
        e.preventDefault();
        const collected = parseFloat(document.getElementById("payAmount").value);
        const mode = document.getElementById("payMode").value;
        const newPaid = amountPaid + collected;
        const newStatus = newPaid >= amountDue ? 'Paid' : newPaid > 0 ? 'Partial' : 'Pending';
        const generatedReceipt = "REC-" + new Date().getFullYear() + "-" + Math.floor(1000 + Math.random() * 9000);

        const { error } = await sbClient.from("fees").update({
          amount_paid: newPaid,
          status: newStatus,
          payment_mode: mode,
          receipt_no: generatedReceipt,
          paid_at: new Date().toISOString()
        }).eq("id", feeId);

        if (error) {
          alert("Failed to record payment: " + error.message);
          return;
        }

        modal.remove();
        loadTabContent();
      };
    };

    window.sendWhatsAppNotice = (studentName, mobile, parentName, cycle, due, paid, receiptNo, status) => {
      if (!mobile || mobile.trim() === "") {
        alert("No mobile number registered for this parent.");
        return;
      }
      const cleanMobile = mobile.replace(/[^0-9]/g, "").slice(-10);
      const balance = due - paid;
      let message = "";

      if (status === "Paid") {
        message = `*VIDYATRACK ACADEMY - FEE RECEIPT*\n----------------------------------------\n*Receipt No:* ${receiptNo || 'REC-' + Date.now().toString().slice(-4)}\n*Date:* ${new Date().toLocaleDateString('en-IN')}\n*Student Name:* ${studentName}\n*Billing Cycle:* ${cycle}\n\n*Amount Received:* ₹${paid.toLocaleString("en-IN")}\n*Status:* Fully Settled (PAID) ✅\n\nThank you, ${parentName || 'Parent'}, for your prompt payment!`;
      } else {
        message = `*VIDYATRACK ACADEMY - FEE REMINDER*\n----------------------------------------\nDear ${parentName || 'Parent'},\nThis is a gentle reminder regarding tuition dues for *${studentName}*.\n\n*Billing Cycle:* ${cycle}\n*Total Fee:* ₹${due.toLocaleString("en-IN")}\n*Paid so far:* ₹${paid.toLocaleString("en-IN")}\n*Outstanding Balance:* ₹${balance.toLocaleString("en-IN")} ⚠️\n\nKindly arrange for the balance settlement at your earliest convenience. Thank you!`;
      }

      window.open("https://wa.me/91" + cleanMobile + "?text=" + encodeURIComponent(message), "_blank");
    };

    window.generateMonthlyDues = async () => {
      const monthYear = prompt("Enter billing cycle (YYYY-MM):", new Date().toISOString().slice(0, 7));
      if (!monthYear) return;

      const { data: students, error: sErr } = await sbClient.from("students").select("id, monthly_fee").eq("is_active", true);
      if (sErr || !students || students.length === 0) {
        alert("No active students found to bill.");
        return;
      }

      const records = students.map(s => ({
        student_id: s.id,
        month_year: monthYear,
        amount_due: s.monthly_fee || 0,
        amount_paid: 0.00,
        status: 'Pending'
      }));

      const { error } = await sbClient.from("fees").upsert(records, { onConflict: "student_id,month_year" });
      if (error) alert("Error generating dues: " + error.message);
      else {
        alert("Invoices created for " + monthYear);
        loadTabContent();
      }
    };

    // ==========================================
    // 2. STUDENTS DIRECTORY, SEARCH, ATTENDANCE & ACADEMICS
    // ==========================================
    async function renderStudentsTab(container) {
      const { data: students, error } = await sbClient.from("students").select("*").order("name");
      if (error) {
        container.innerHTML = `<div class="p-4 text-rose-500 text-xs">${error.message}</div>`;
        return;
      }

      container.innerHTML = `
        <div class="space-y-4">
          <!-- SEARCH & ADD BAR -->
          <div class="flex gap-2">
            <div class="relative flex-1">
              <input type="text" id="searchInput" onkeyup="filterStudents()" placeholder="Search student or mobile..." class="w-full pl-9 pr-3 py-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500 shadow-xs" />
              <span class="absolute left-3 top-2.5 text-slate-400 text-xs">🔍</span>
            </div>
            <button onclick="openAddStudentModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-xl text-xs font-bold shadow-xs whitespace-nowrap">
              + New Student
            </button>
          </div>

          <div class="flex justify-between items-center">
            <h3 class="text-xs font-bold uppercase text-slate-400">Directory (${students?.length || 0})</h3>
          </div>

          <div class="space-y-3" id="studentsList">
            ${(students || []).map(s => `
              <div class="student-card bg-white dark:bg-slate-900 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-xs space-y-3" data-search="${(s.name || '').toLowerCase()} ${(s.parent_mobile || '')}">
                
                <div class="flex justify-between items-start">
                  <div>
                    <h4 class="font-bold text-slate-800 dark:text-white text-sm">${s.name}</h4>
                    <p class="text-[10px] text-slate-400">${s.grade_class} • Parent: ${s.parent_name || ''} (${s.parent_mobile || ''})</p>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-indigo-600 dark:text-indigo-400 text-xs">₹${parseFloat(s.monthly_fee || 0).toLocaleString("en-IN")}/mo</span>
                    ${currentUserRole === 'admin' ? `
                      <button onclick="deleteStudent('${s.id}', '${s.name}')" class="text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/50 p-1 rounded-lg text-xs" title="Admin Delete">🗑️</button>
                    ` : ''}
                  </div>
                </div>

                <div class="grid grid-cols-2 gap-2 border-t border-slate-100 dark:border-slate-800 pt-2">
                  <button onclick="openAttendance('${s.id}', '${s.name}', '${s.parent_mobile}')" class="flex justify-center items-center gap-1.5 py-1.5 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-lg text-[10px] font-bold border border-slate-200 dark:border-slate-700">
                    📅 Attendance
                  </button>
                  <button onclick="openPerformance('${s.id}', '${s.name}')" class="flex justify-center items-center gap-1.5 py-1.5 bg-indigo-50 dark:bg-indigo-950/30 text-indigo-700 dark:text-indigo-400 rounded-lg text-[10px] font-bold border border-indigo-200 dark:border-indigo-900">
                    📊 Academics &amp; Report
                  </button>
                </div>

              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    window.filterStudents = () => {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const cards = document.querySelectorAll(".student-card");
      cards.forEach(card => {
        const text = card.getAttribute("data-search");
        card.style.display = text.includes(query) ? "block" : "none";
      });
    };

    window.openAddStudentModal = () => {
      const slot = document.getElementById("modalSlot");
      const modal = document.createElement("div");
      modal.className = "fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4";
      modal.innerHTML = `
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 w-full max-w-sm space-y-3 shadow-xl">
          <h3 class="text-xs font-bold text-slate-800 dark:text-white uppercase tracking-wider">Add New Student</h3>
          <form id="newStudentForm" class="space-y-2 text-xs">
            <input type="text" name="name" placeholder="Student Full Name *" required class="w-full p-2 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 outline-none" />
            <input type="text" name="grade_class" placeholder="Class / Grade (e.g. Class 10) *" required class="w-full p-2 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 outline-none" />
            <input type="date" name="dob" required class="w-full p-2 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 outline-none" />
            <input type="text" name="parent_name" placeholder="Parent Name *" required class="w-full p-2 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 outline-none" />
            <input type="tel" name="parent_mobile" pattern="[0-9]{10}" placeholder="Parent Mobile (10 digits) *" required class="w-full p-2 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 outline-none" />
            <input type="number" name="monthly_fee" placeholder="Monthly Fee (₹) *" required class="w-full p-2 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 outline-none" />
            <div class="flex gap-2 pt-2">
              <button type="button" onclick="this.closest('.fixed').remove()" class="flex-1 py-2 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 rounded-xl font-bold">Cancel</button>
              <button type="submit" class="flex-1 py-2 bg-indigo-600 text-white rounded-xl font-bold">Save Student</button>
            </div>
          </form>
        </div>
      `;
      slot.appendChild(modal);

      modal.querySelector("#newStudentForm").onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const payload = Object.fromEntries(fd.entries());
        payload.student_id = "STU-" + Date.now().toString().slice(-4);
        payload.is_active = true;

        const { error } = await sbClient.from("students").insert([payload]);
        if (error) {
          alert("Error adding student: " + error.message);
          return;
        }
        modal.remove();
        loadTabContent();
      };
    };

    window.deleteStudent = async (id, name) => {
      if (currentUserRole !== 'admin') {
        alert("Action Denied: Only Admins can delete student records.");
        return;
      }
      if (!confirm(`Are you sure you want to permanently delete ${name}? All associated fees and attendance records will be removed.`)) return;

      const { error } = await sbClient.from("students").delete().eq("id", id);
      if (error) alert("Error deleting student: " + error.message);
      else loadTabContent();
    };

    window.openAttendance = (id, name, mobile) => {
      const slot = document.getElementById("modalSlot");
      const today = new Date().toISOString().split('T')[0];

      slot.innerHTML = `
        <div class="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center sm:p-4 pb-0 no-print">
          <div class="bg-white dark:bg-slate-900 rounded-t-3xl sm:rounded-3xl p-5 w-full max-w-sm space-y-4 shadow-xl">
            <div class="flex justify-between items-center">
              <h3 class="text-sm font-bold text-slate-800 dark:text-white">Mark Attendance</h3>
              <span class="text-xs font-mono bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded text-slate-600">${today}</span>
            </div>
            <p class="text-xs text-slate-500">Student: <strong>${name}</strong></p>

            <div class="grid grid-cols-2 gap-3 pt-2">
              <button onclick="saveAttendance('${id}', '${today}', 'Present', '${name}', '${mobile}')" class="py-3 bg-emerald-100 text-emerald-800 border border-emerald-300 rounded-xl font-bold text-sm">Present ✅</button>
              <button onclick="saveAttendance('${id}', '${today}', 'Absent', '${name}', '${mobile}')" class="py-3 bg-rose-100 text-rose-800 border border-rose-300 rounded-xl font-bold text-sm">Absent ❌</button>
            </div>
            <button onclick="document.getElementById('modalSlot').innerHTML=''" class="w-full mt-2 py-2 text-slate-400 text-xs font-bold">Cancel</button>
          </div>
        </div>
      `;
    };

    window.saveAttendance = async (studentId, date, status, name, mobile) => {
      const { error } = await sbClient.from("attendance").upsert(
        { student_id: studentId, record_date: date, status: status },
        { onConflict: 'student_id,record_date' }
      );

      if (error) {
        alert("Database Error: " + error.message);
        return;
      }

      document.getElementById('modalSlot').innerHTML = '';
      alert(`Attendance for ${name} marked as ${status}.`);

      if (status === 'Absent' && mobile && confirm(`${name} was marked Absent. Send alert to parent via WhatsApp?`)) {
        const cleanMobile = mobile.replace(/[^0-9]/g, "").slice(-10);
        const msg = encodeURIComponent(`*VIDYATRACK ACADEMY - ATTENDANCE ALERT*\n\nDear Parent,\nPlease be advised that *${name}* was marked *ABSENT* today (${new Date().toLocaleDateString('en-IN')}).\n\nIf this was unexcused, please reach out to the administration.`);
        window.open(`https://wa.me/91${cleanMobile}?text=${msg}`, "_blank");
      }
    };

    window.openPerformance = async (studentId, name) => {
      const slot = document.getElementById("modalSlot");
      
      const dummyMarks = [
        { subject: "Mathematics", score: 88, max: 100 },
        { subject: "Science", score: 91, max: 100 },
        { subject: "Social Studies", score: 79, max: 100 },
        { subject: "English", score: 84, max: 100 }
      ];
      const total = dummyMarks.reduce((acc, m) => acc + m.score, 0);
      const percentage = (total / (dummyMarks.length * 100) * 100).toFixed(1);

      slot.innerHTML = `
        <div class="fixed inset-0 bg-slate-100 dark:bg-slate-900 z-50 flex flex-col p-4 overflow-y-auto">
          <div class="flex justify-between items-center mb-4 no-print max-w-2xl mx-auto w-full">
            <button onclick="document.getElementById('modalSlot').innerHTML=''" class="text-xs bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-3 py-1.5 rounded-lg font-bold">← Back</button>
            <button onclick="window.print()" class="text-xs bg-indigo-600 text-white px-4 py-1.5 rounded-lg font-bold shadow-xs">🖨️ Print / Save PDF</button>
          </div>

          <div id="printArea" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 max-w-2xl mx-auto w-full space-y-6 text-slate-900">
            <div class="text-center border-b border-slate-300 pb-4">
              <h1 class="text-xl font-black uppercase tracking-widest text-indigo-900">VidyaTrack Academy</h1>
              <p class="text-xs text-slate-500 uppercase mt-1">Official Student Progress Report</p>
            </div>

            <div class="grid grid-cols-2 gap-4 text-xs">
              <div><span class="text-slate-500">Student Name:</span> <strong>${name}</strong></div>
              <div class="text-right"><span class="text-slate-500">Term:</span> Annual Exam 2026</div>
            </div>

            <table class="w-full text-left text-xs border-collapse">
              <thead>
                <tr class="bg-slate-100 text-slate-700 uppercase">
                  <th class="p-2 border border-slate-300">Subject</th>
                  <th class="p-2 border border-slate-300 text-center">Max Marks</th>
                  <th class="p-2 border border-slate-300 text-center">Marks Obtained</th>
                </tr>
              </thead>
              <tbody>
                ${dummyMarks.map(m => `
                  <tr>
                    <td class="p-2 border border-slate-300 font-medium">${m.subject}</td>
                    <td class="p-2 border border-slate-300 text-center text-slate-600">${m.max}</td>
                    <td class="p-2 border border-slate-300 text-center font-bold">${m.score}</td>
                  </tr>
                `).join("")}
                <tr class="bg-slate-50">
                  <td class="p-2 border border-slate-300 font-bold text-right">TOTAL / PERCENTAGE</td>
                  <td class="p-2 border border-slate-300 text-center font-bold">${dummyMarks.length * 100}</td>
                  <td class="p-2 border border-slate-300 text-center font-bold text-indigo-700">${total} (${percentage}%)</td>
                </tr>
              </tbody>
            </table>
<div class="pt-12 flex justify-between items-end text-xs">
              <div class="border-t border-slate-400 w-32 text-center pt-2">Class Teacher</div>
              <div class="border-t border-slate-400 w-32 text-center pt-2">Principal</div>
            </div>
          </div>
        </div>
      `;
    };

    function startApp() {
      if (sbClient) {
        sbClient.auth.onAuthStateChange(async (_, session) => {
          currentUser = session ? session.user : null;
          if (currentUser) currentUserRole = await fetchUserRole(currentUser.id);
          if (!currentUser) renderLoginView();
          else {
            renderMainShell();
            loadTabContent();
          }
        });

        sbClient.auth.getSession().then(async ({ data: { session } }) => {
          currentUser = session ? session.user : null;
          if (currentUser) currentUserRole = await fetchUserRole(currentUser.id);
          if (!currentUser) renderLoginView();
          else {
            renderMainShell();
            loadTabContent();
          }
        });
      } else {
        renderLoginView();
      }
    }

    startApp();
  </script>
</body>
</html>
