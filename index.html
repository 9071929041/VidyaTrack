<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VidyaTrack - Classroom & Ledger OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #printReportArea, #printReportArea * { visibility: visible; }
      #printReportArea { position: absolute; left: 0; top: 0; width: 100%; padding: 20px; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen antialiased">
  <div id="app" class="max-w-xl mx-auto min-h-screen flex flex-col pb-24 sm:pb-12">
    <div class="p-8 text-center text-xs text-slate-400">Loading VidyaTrack OS...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://potwcgsmaogmnqbktftm.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvdHdjZ3NtYW9nbW5xYmt0ZnRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NTQ3OTIsImV4cCI6MjEwNDUzMDc5Mn0.8Tn1cVEbID48PvAOqztUY2sNDDrDBBgYH4V9zH1ksZ8";

    let sbClient = null;
    try {
      if (window.supabase) sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (e) { console.error("Supabase init error", e); }

    const app = document.getElementById("app");
    let currentUser = null;
    let currentUserRole = "admin";
    let currentTab = "academics";
    let isDarkMode = localStorage.getItem("vt_dark") === "true";
    let selectedAttendanceDate = new Date().toISOString().split('T')[0];
    let selectedRemarkLang = "English";
    let currentReportPayload = null;

    if (isDarkMode) document.documentElement.classList.add("dark");

    async function fetchUserRole(userId) {
      if (!sbClient) return "admin";
      try {
        const { data } = await sbClient.from("user_roles").select("role").eq("user_id", userId).maybeSingle();
        return data ? data.role : "admin";
      } catch { return "admin"; }
    }

    function renderLoginView() {
      app.innerHTML = `
        <div class="flex-1 flex flex-col justify-center px-6 py-12">
          <div class="text-center mb-8">
            <div class="inline-flex p-3.5 bg-indigo-600 text-white rounded-2xl shadow-xl mb-3">
              <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"></path></svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">VidyaTrack</h1>
            <p class="text-xs text-slate-500 mt-1">Classroom Registry &amp; Ledger OS</p>
          </div>
          <form id="loginForm" class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Email</label>
              <input type="email" id="loginEmail" required class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="admin@vidyatrack.com" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Password</label>
              <input type="password" id="loginPassword" required class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••••••" />
            </div>
            <p id="authError" class="text-xs text-rose-500 hidden font-medium"></p>
            <button type="submit" id="loginBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm shadow-sm transition">Sign In</button>
          </form>
        </div>
      `;

      document.getElementById("loginForm").onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById("loginBtn");
        const err = document.getElementById("authError");
        btn.disabled = true; btn.innerText = "Signing in..."; err.classList.add("hidden");

        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;

        const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
        if (error) {
          err.innerText = error.message; err.classList.remove("hidden");
          btn.disabled = false; btn.innerText = "Sign In";
        } else {
          currentUser = data.user;
          currentUserRole = await fetchUserRole(currentUser.id);
          renderMainShell();
          loadTabContent();
        }
      };
    }

    function renderMainShell() {
      app.innerHTML = `
        <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur border-b border-slate-200 dark:border-slate-800 px-4 py-3 sticky top-0 z-30 flex justify-between items-center no-print">
          <div class="flex items-center gap-2">
            <div class="p-1.5 bg-indigo-600 text-white rounded-lg">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"></path></svg>
            </div>
            <div>
              <h2 class="text-base font-bold text-slate-900 dark:text-white leading-tight">VidyaTrack</h2>
              <span class="text-[9px] uppercase tracking-wider font-extrabold px-1.5 py-0.2 rounded border bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300 border-amber-300">
                ${currentUserRole}
              </span>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="toggleDarkMode()" class="p-2 text-slate-500 rounded-lg text-xs">${isDarkMode ? '☀️' : '🌙'}</button>
            <button onclick="handleLogout()" class="text-xs px-2.5 py-1 bg-rose-50 text-rose-600 dark:bg-rose-950/40 dark:text-rose-400 rounded-lg font-medium">Exit</button>
          </div>
        </header>

        <main id="tabContent" class="flex-1 p-4 overflow-y-auto"></main>
        <div id="modalSlot"></div>

        <div class="fixed bottom-20 right-4 z-40 no-print">
          <button onclick="toggleAIChat(true)" class="flex items-center gap-1.5 px-3.5 py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white rounded-full shadow-lg hover:scale-105 active:scale-95 transition-all text-xs font-bold border border-white/20">
            <span class="text-base">✨</span>
            <span>Ask Vidya AI</span>
          </button>
        </div>

        <div id="aiDrawer" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 no-print">
          <div class="bg-white dark:bg-slate-900 w-full max-w-lg rounded-t-3xl sm:rounded-3xl h-[85vh] sm:h-[650px] flex flex-col shadow-2xl overflow-hidden border border-slate-200 dark:border-slate-800">
            <div class="p-3.5 px-4 bg-slate-50 dark:bg-slate-800/80 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center">
              <div class="flex items-center gap-2">
                <span class="p-1.5 bg-gradient-to-br from-purple-500 to-indigo-600 text-white rounded-xl text-sm">✨</span>
                <div>
                  <h3 class="text-xs font-bold text-slate-900 dark:text-white">Vidya AI Assistant</h3>
                  <p class="text-[9px] text-slate-400">Classroom Analytics &amp; Instant Insights</p>
                </div>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="configureGeminiKey()" class="text-[10px] font-bold text-slate-500 hover:text-indigo-600 px-2 py-1 rounded-lg bg-slate-200 dark:bg-slate-700">⚙️ API Key</button>
                <button onclick="toggleAIChat(false)" class="text-slate-400 hover:text-slate-600 font-bold text-sm p-1">✕</button>
              </div>
            </div>

            <div class="p-2 px-3 bg-slate-100/50 dark:bg-slate-950/40 border-b border-slate-200 dark:border-slate-800 flex gap-1.5 overflow-x-auto text-[10px] no-scrollbar">
              <button onclick="quickAskAI('Who are the top 3 distinction rankers in the latest test?')" class="whitespace-nowrap px-2.5 py-1 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-medium hover:border-indigo-500">🏆 Top 3 Rankers</button>
              <button onclick="quickAskAI('Which students have outstanding unpaid fees? List amounts.')" class="whitespace-nowrap px-2.5 py-1 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-medium hover:border-indigo-500">💰 Unpaid Fees</button>
              <button onclick="quickAskAI('Show attendance rate and list students who have been absent.')" class="whitespace-nowrap px-2.5 py-1 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-medium hover:border-indigo-500">📅 Absentee Alert</button>
            </div>

            <div id="aiMessagesContainer" class="flex-1 p-4 overflow-y-auto space-y-3 text-xs">
              <div class="flex items-start gap-2">
                <div class="p-1 bg-indigo-600 text-white rounded-lg text-xs">🤖</div>
                <div class="bg-slate-100 dark:bg-slate-800 p-3 rounded-2xl rounded-tl-sm text-slate-800 dark:text-slate-200 max-w-[85%] leading-relaxed">
                  Hello! I have full access to your students, tests, marks, attendance, and fee ledgers.
                </div>
              </div>
            </div>

            <form onsubmit="handleAISend(event)" class="p-3 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex gap-2">
              <input type="text" id="aiInput" placeholder="Ask about marks, top rankers, fees..." required class="flex-1 px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500" />
              <button type="submit" id="aiSendBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow-xs transition">Send</button>
            </form>
          </div>
        </div>

        <nav class="fixed bottom-0 left-0 right-0 max-w-xl mx-auto bg-white/95 dark:bg-slate-900/95 backdrop-blur border-t border-slate-200 dark:border-slate-800 px-1 py-1.5 flex justify-between items-center z-30 no-print">
          ${navButton('fees', 'Fees', '💰')}
          ${navButton('students', 'Students', '👨‍🎓')}
          ${navButton('attendance', 'Attendance', '📅')}
          ${navButton('academics', 'Marks', '📝')}
          ${navButton('reports', 'Reports', '📊')}
        </nav>
      `;
    }

    function navButton(tabId, label, icon) {
      const active = currentTab === tabId;
      return `
        <button onclick="switchTab('${tabId}')" class="flex-1 flex flex-col items-center py-1 rounded-xl transition ${active ? 'text-indigo-600 font-bold dark:text-indigo-400' : 'text-slate-400 hover:text-slate-600'}">
          <span class="text-base">${icon}</span>
          <span class="text-[9px] mt-0.5">${label}</span>
        </button>
      `;
    }

    window.switchTab = (tabId) => {
      currentTab = tabId;
      renderMainShell();
      loadTabContent();
    };

    window.toggleDarkMode = () => {
      isDarkMode = !isDarkMode;
      localStorage.setItem("vt_dark", isDarkMode);
      document.documentElement.classList.toggle("dark", isDarkMode);
      renderMainShell();
      loadTabContent();
    };

    window.handleLogout = async () => {
      if (sbClient) await sbClient.auth.signOut();
      currentUser = null;
      renderLoginView();
    };

    async function loadTabContent() {
      const content = document.getElementById("tabContent");
      if (!content) return;
      content.innerHTML = `<div class="py-20 text-center text-xs text-slate-400 animate-pulse">Loading module...</div>`;

      if (currentTab === "fees") await renderFeesTab(content);
      if (currentTab === "students") await renderStudentsTab(content);
      if (currentTab === "attendance") await renderAttendanceTab(content);
      if (currentTab === "academics") await renderAcademicsTab(content);
      if (currentTab === "reports") await renderReportsTab(content);
    }

    window.toggleAIChat = (show) => {
      const drawer = document.getElementById("aiDrawer");
      if (drawer) drawer.classList.toggle("hidden", !show);
    };

    window.configureGeminiKey = () => {
      const current = localStorage.getItem("vt_gemini_key") || "";
      const key = prompt("Enter your Google Gemini API Key:", current);
      if (key !== null) {
        localStorage.setItem("vt_gemini_key", key.trim());
        alert(key.trim() ? "Gemini API Key configured!" : "API Key cleared.");
      }
    };

    window.quickAskAI = (question) => {
      document.getElementById("aiInput").value = question;
      handleAISend(new Event("submit"));
    };

    window.handleAISend = async (e) => {
      if (e) e.preventDefault();
      const input = document.getElementById("aiInput");
      const query = input.value.trim();
      if (!query) return;

      let apiKey = localStorage.getItem("vt_gemini_key");
      if (!apiKey) {
        apiKey = prompt("Please enter your Google Gemini API Key from Google AI Studio:");
        if (!apiKey) return;
        localStorage.setItem("vt_gemini_key", apiKey.trim());
      }

      const container = document.getElementById("aiMessagesContainer");
      const sendBtn = document.getElementById("aiSendBtn");
      input.value = "";
      sendBtn.disabled = true;
      sendBtn.innerText = "Analyzing...";

      container.innerHTML += `
        <div class="flex items-start justify-end gap-2">
          <div class="bg-indigo-600 text-white p-3 rounded-2xl rounded-tr-sm max-w-[85%] leading-relaxed">${query}</div>
        </div>
      `;
      container.scrollTop = container.scrollHeight;

      const loadingId = "ai_load_" + Date.now();
      container.innerHTML += `
        <div id="${loadingId}" class="flex items-start gap-2">
          <div class="p-1 bg-indigo-600 text-white rounded-lg text-xs">🤖</div>
          <div class="bg-slate-100 dark:bg-slate-800 p-3 rounded-2xl rounded-tl-sm text-slate-400 text-xs italic animate-pulse">Querying live database...</div>
        </div>
      `;
      container.scrollTop = container.scrollHeight;

      try {
        const [ { data: students }, { data: marks }, { data: attendance }, { data: fees } ] = await Promise.all([
          sbClient.from("students").select("id, name, grade_class, monthly_fee, parent_name, parent_mobile").eq("is_active", true),
          sbClient.from("test_marks").select("student_id, test_name, test_date, subject, min_score, max_score, obtained_score"),
          sbClient.from("attendance").select("student_id, record_date, status"),
          sbClient.from("fees").select("student_id, month_year, amount_due, amount_paid, status")
        ]);

        const dbContext = { registered_students: students || [], test_marks_records: marks || [], attendance_records: attendance || [], fee_records: fees || [] };
        const systemInstructions = `You are VidyaTrack AI, classroom assistant. Live Snapshot: ${JSON.stringify(dbContext)}`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: systemInstructions }, { text: query }] }] })
        });

        const data = await response.json();
        document.getElementById(loadingId)?.remove();

        if (data.error) throw new Error(data.error.message || "API error");

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response generated.";
        const formattedReply = reply.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\*(.*?)\*/g, '<em>$1</em>').replace(/\n/g, '<br/>');

        container.innerHTML += `
          <div class="flex items-start gap-2">
            <div class="p-1 bg-indigo-600 text-white rounded-lg text-xs">🤖</div>
            <div class="bg-slate-100 dark:bg-slate-800 p-3 rounded-2xl rounded-tl-sm text-slate-800 dark:text-slate-200 max-w-[85%] leading-relaxed">${formattedReply}</div>
          </div>
        `;
      } catch (err) {
        document.getElementById(loadingId)?.remove();
        container.innerHTML += `
          <div class="flex items-start gap-2">
            <div class="p-1 bg-rose-600 text-white rounded-lg text-xs">⚠️</div>
            <div class="bg-rose-50 dark:bg-rose-950/50 p-3 rounded-2xl rounded-tl-sm text-rose-600 dark:text-rose-400 text-xs">Error: ${err.message}</div>
          </div>
        `;
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = "Send";
        container.scrollTop = container.scrollHeight;
      }
    };

    // FEES TAB
    async function renderFeesTab(container) {
      const currentMonth = new Date().toISOString().slice(0, 7);
      const { data: fees } = await sbClient.from("fees").select("*, students(name, student_id, parent_mobile, parent_name, grade_class)").order("created_at", { ascending: false });

      const totalBilled = (fees || []).reduce((acc, f) => acc + parseFloat(f.amount_due || 0), 0);
      const totalCollected = (fees || []).reduce((acc, f) => acc + parseFloat(f.amount_paid || 0), 0);
      const totalPending = totalBilled - totalCollected;

      container.innerHTML = `
        <div class="space-y-4">
          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800">
              <p class="text-[10px] text-slate-400 font-bold uppercase">Billed</p>
              <p class="text-xs font-extrabold text-slate-800 dark:text-white mt-0.5">₹${totalBilled.toLocaleString("en-IN")}</p>
            </div>
            <div class="bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800">
              <p class="text-[10px] text-slate-400 font-bold uppercase">Collected</p>
              <p class="text-xs font-extrabold text-emerald-600 mt-0.5">₹${totalCollected.toLocaleString("en-IN")}</p>
            </div>
            <div class="bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800">
              <p class="text-[10px] text-slate-400 font-bold uppercase">Pending</p>
              <p class="text-xs font-extrabold text-rose-600 mt-0.5">₹${totalPending.toLocaleString("en-IN")}</p>
            </div>
          </div>

          <div class="flex justify-between items-center">
            <h3 class="text-xs font-bold uppercase text-slate-400">Ledger Statements</h3>
            <button onclick="generateMonthlyDues()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-xs">⚡ Generate Invoices (${currentMonth})</button>
          </div>

          <div class="space-y-2">
            ${(!fees || fees.length === 0) ? `
              <div class="p-8 text-center text-xs text-slate-400 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800">No fee statements found.</div>
            ` : fees.map(f => {
              const balance = parseFloat(f.amount_due) - parseFloat(f.amount_paid);
              const student = f.students || {};
              const isPaid = f.status === 'Paid';
              return `
                <div class="bg-white dark:bg-slate-900 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-xs space-y-2.5">
                  <div class="flex justify-between items-start">
                    <div>
                      <h4 class="text-xs font-bold text-slate-800 dark:text-slate-100">${student.name || 'Unknown'}</h4>
                      <p class="text-[10px] text-slate-400 font-mono">${student.grade_class || ''} • Cycle: ${f.month_year}</p>
                    </div>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${isPaid ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}">${f.status}</span>
                  </div>
                  <div class="flex justify-between items-center text-xs pt-1 border-t border-slate-100 dark:border-slate-800">
                    <div>
                      <span class="font-extrabold text-slate-800 dark:text-slate-200">₹${parseFloat(f.amount_paid).toLocaleString("en-IN")}</span>
                      <span class="text-[11px] text-slate-400">/ ₹${parseFloat(f.amount_due).toLocaleString("en-IN")}</span>
                    </div>
                    <div class="flex gap-1.5">
                      ${!isPaid ? `<button onclick="openPaymentModal('${f.id}', ${f.amount_due}, ${f.amount_paid})" class="px-2.5 py-1 bg-indigo-600 text-white rounded-lg text-[10px] font-bold">Collect</button>` : ''}
                      <button onclick="sendWhatsAppNotice('${student.name || ''}', '${student.parent_mobile || ''}', '${student.parent_name || ''}', '${f.month_year}', ${f.amount_due}, ${f.amount_paid}, '${f.receipt_no || ''}', '${f.status}')" class="px-2 py-1 bg-emerald-500 text-white rounded-lg text-[10px] font-bold">💬 WhatsApp</button>
                    </div>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    window.openPaymentModal = (feeId, amountDue, amountPaid) => {
      const balance = amountDue - amountPaid;
      const slot = document.getElementById("modalSlot");
      const modal = document.createElement("div");
      modal.className = "fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4";
      modal.innerHTML = `
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 w-full max-w-xs space-y-3 shadow-xl">
          <h3 class="text-xs font-bold uppercase">Record Fee Payment</h3>
          <p class="text-xs text-slate-400">Due: <strong class="text-rose-500">₹${balance.toLocaleString("en-IN")}</strong></p>
          <form id="payForm" class="space-y-3 text-xs">
            <input type="number" id="payAmount" min="1" max="${balance}" value="${balance}" required class="w-full p-2 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 font-bold" />
            <div class="flex gap-2">
              <button type="button" onclick="this.closest('.fixed').remove()" class="flex-1 py-2 bg-slate-100 rounded-xl font-bold">Cancel</button>
              <button type="submit" class="flex-1 py-2 bg-indigo-600 text-white rounded-xl font-bold">Save</button>
            </div>
          </form>
        </div>
      `;
      slot.appendChild(modal);

      modal.querySelector("#payForm").onsubmit = async (e) => {
        e.preventDefault();
        const collected = parseFloat(document.getElementById("payAmount").value);
        const newPaid = amountPaid + collected;
        const newStatus = newPaid >= amountDue ? 'Paid' : 'Partial';

        await sbClient.from("fees").update({ amount_paid: newPaid, status: newStatus, receipt_no: "REC-" + Date.now().toString().slice(-4), paid_at: new Date().toISOString() }).eq("id", feeId);
        modal.remove();
        loadTabContent();
      };
    };

    window.sendWhatsAppNotice = (name, mobile, parent, cycle, due, paid, receiptNo, status) => {
      if (!mobile) return alert("No mobile number found.");
      const clean = mobile.replace(/[^0-9]/g, "").slice(-10);
      const msg = status === "Paid"

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
        });
        const data = await res.json();
        const remark = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "Good progress.";
        currentReportPayload.aiRemark = remark;
        text.innerText = `"${remark}"`;
        box.classList.remove("hidden");
        btn.innerText = "✨ Regenerate Remark";
      } catch (err) {
        alert("Error: " + err.message);
        btn.innerText = "✨ Generate AI Remark";
      } finally {
        btn.disabled = false;
      }
    };

    window.sendReportWhatsApp = () => {
      if (!currentReportPayload) return;
      const { student, fees, attendance, tests, aiRemark } = currentReportPayload;
      if (!student.parent_mobile) return alert("No phone number registered.");

      const cleanMobile = student.parent_mobile.replace(/[^0-9]/g, "").slice(-10);
      let msg = `*VIDYATRACK REPORT*\nStudent: ${student.name} (${student.grade_class})\nAttendance: ${attendance.attendanceRate}%\nFee Balance: ₹${fees.feeBalance}\n`;
      if (aiRemark) msg += `\n*Teacher's Remark:*\n"${aiRemark}"\n`;

      window.open("https://wa.me/91" + cleanMobile + "?text=" + encodeURIComponent(msg), "_blank");
    };

    window.downloadReportCSV = () => {
      if (!currentReportPayload) return;
      const { student, fees, attendance, tests, aiRemark } = currentReportPayload;

      let csv = `VIDYATRACK ACADEMY PROGRESS REPORT\n`;
      csv += `Student Name,${student.name}\n`;
      csv += `Class / Grade,${student.grade_class}\n`;
      csv += `Parent Name,${student.parent_name || ''}\n`;
      csv += `Parent Mobile,${student.parent_mobile || ''}\n`;
      csv += `Report Date,${new Date().toISOString().split('T')[0]}\n`;
      if (aiRemark) csv += `Teacher Remark,"${aiRemark}"\n`;
      csv += `\nATTENDANCE SUMMARY (${attendance.currentMonth})\n`;
      csv += `Attendance Rate,${attendance.attendanceRate}%\n`;
      csv += `\nFEE SUMMARY\n`;
      csv += `Total Billed,${fees.totalBilled}\nTotal Paid,${fees.totalPaid}\nBalance Due,${fees.feeBalance}\n\n`;

      csv += `ACADEMIC TEST DETAILS\n`;
      csv += `Test Name,Date,Subject,Min Score,Max Score,Obtained Score,Result\n`;

      tests.forEach(t => {
        t.subjects.forEach(sub => {
          const res = parseFloat(sub.obtained_score) >= parseFloat(sub.min_score) ? 'Pass' : 'Fail';
          csv += `"${t.testName}","${t.testDate || ''}","${sub.subject}",${sub.min_score},${sub.max_score},${sub.obtained_score},${res}\n`;
        });
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `${student.name.replace(/\s+/g, '_')}_Progress_Report.csv`;
      link.click();
    };

    // BOOTSTRAP SYSTEM WITH TIMEOUT WATCHDOG
    function startApp() {
      let isRendered = false;

      const watchdog = setTimeout(() => {
        if (!isRendered) {
          isRendered = true;
          renderLoginView();
        }
      }, 1500);

      const initView = async (session) => {
        if (isRendered) return;
        isRendered = true;
        clearTimeout(watchdog);

        currentUser = session ? session.user : null;
        if (currentUser) {
          currentUserRole = await fetchUserRole(currentUser.id);
          renderMainShell();
          loadTabContent();
        } else {
          renderLoginView();
        }
      };

      if (sbClient && sbClient.auth) {
        sbClient.auth.getSession().then(({ data: { session } }) => {
          initView(session);
        }).catch(() => {
          initView(null);
        });

        sbClient.auth.onAuthStateChange((_, session) => {
          initView(session);
        });
      } else {
        clearTimeout(watchdog);
        renderLoginView();
      }
    }

    startApp();
  </script>
</body>
</html>
