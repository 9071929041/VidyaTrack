<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VidyaTrack - Classroom & Ledger OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #printReportArea, #printReportArea * { visibility: visible; }
      #printReportArea { position: absolute; left: 0; top: 0; width: 100%; padding: 20px; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen antialiased">
  <div id="app" class="max-w-xl mx-auto min-h-screen flex flex-col pb-24 sm:pb-12">
    <div class="p-8 text-center text-xs text-slate-400">Loading VidyaTrack OS...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://potwcgsmaogmnqbktftm.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvdHdjZ3NtYW9nbW5xYmt0ZnRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NTQ3OTIsImV4cCI6MjEwNDUzMDc5Mn0.8Tn1cVEbID48PvAOqztUY2sNDDrDBBgYH4V9zH1ksZ8";

    let sbClient = null;
    try {
      if (window.supabase) sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (e) { console.error("Supabase init error", e); }

    const app = document.getElementById("app");
    let currentUser = null;
    let currentUserRole = "admin";
    let currentTab = "fees";
    let isDarkMode = localStorage.getItem("vt_dark") === "true";
    let selectedAttendanceDate = new Date().toISOString().split('T')[0];

    if (isDarkMode) document.documentElement.classList.add("dark");

    async function fetchUserRole(userId) {
      if (!sbClient) return "admin";
      try {
        const { data } = await sbClient.from("user_roles").select("role").eq("user_id", userId).maybeSingle();
        return data ? data.role : "admin";
      } catch { return "admin"; }
    }

    function renderLoginView() {
      app.innerHTML = `
        <div class="flex-1 flex flex-col justify-center px-6 py-12">
          <div class="text-center mb-8">
            <div class="inline-flex p-3.5 bg-indigo-600 text-white rounded-2xl shadow-xl mb-3">
              <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"></path></svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">VidyaTrack</h1>
            <p class="text-xs text-slate-500 mt-1">Classroom Registry &amp; Ledger OS</p>
          </div>
          <form id="loginForm" class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Email</label>
              <input type="email" id="loginEmail" required class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="admin@vidyatrack.com" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Password</label>
              <input type="password" id="loginPassword" required class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••••••" />
            </div>
            <p id="authError" class="text-xs text-rose-500 hidden font-medium"></p>
            <button type="submit" id="loginBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm shadow-sm transition">Sign In</button>
          </form>
        </div>
      `;

      document.getElementById("loginForm").onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById("loginBtn");
        const err = document.getElementById("authError");
        btn.disabled = true; btn.innerText = "Signing in..."; err.classList.add("hidden");

        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;

        const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
        if (error) {
          err.innerText = error.message; err.classList.remove("hidden");
          btn.disabled = false; btn.innerText = "Sign In";
        } else {
          currentUser = data.user;
          currentUserRole = await fetchUserRole(currentUser.id);
          renderMainShell();
          loadTabContent();
        }
      };
    }

    function renderMainShell() {
      app.innerHTML = `
        <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur border-b border-slate-200 dark:border-slate-800 px-4 py-3 sticky top-0 z-30 flex justify-between items-center no-print">
          <div class="flex items-center gap-2">
            <div class="p-1.5 bg-indigo-600 text-white rounded-lg">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"></path></svg>
            </div>
            <div>
              <h2 class="text-base font-bold text-slate-900 dark:text-white leading-tight">VidyaTrack</h2>
              <span class="text-[9px] uppercase tracking-wider font-extrabold px-1.5 py-0.2 rounded border bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300 border-amber-300">
                ${currentUserRole}
              </span>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="toggleDarkMode()" class="p-2 text-slate-500 rounded-lg text-xs">${isDarkMode ? '☀️' : '🌙'}</button>
            <button onclick="handleLogout()" class="text-xs px-2.5 py-1 bg-rose-50 text-rose-600 dark:bg-rose-950/40 dark:text-rose-400 rounded-lg font-medium">Exit</button>
          </div>
        </header>

        <main id="tabContent" class="flex-1 p-4 overflow-y-auto"></main>
        <div id="modalSlot"></div>

        <!-- FLOATING AI ASSISTANT BUTTON -->
        <div class="fixed bottom-20 right-4 z-40 no-print">
          <button onclick="toggleAIChat(true)" class="flex items-center gap-1.5 px-3.5 py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white rounded-full shadow-lg hover:scale-105 active:scale-95 transition-all text-xs font-bold border border-white/20">
            <span class="text-base">✨</span>
            <span>Ask Vidya AI</span>
          </button>
        </div>

        <!-- AI ASSISTANT MODAL DRAWER -->
        <div id="aiDrawer" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 no-print">
          <div class="bg-white dark:bg-slate-900 w-full max-w-lg rounded-t-3xl sm:rounded-3xl h-[85vh] sm:h-[650px] flex flex-col shadow-2xl overflow-hidden border border-slate-200 dark:border-slate-800">
            
            <!-- AI Header -->
            <div class="p-3.5 px-4 bg-slate-50 dark:bg-slate-800/80 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center">
              <div class="flex items-center gap-2">
                <span class="p-1.5 bg-gradient-to-br from-purple-500 to-indigo-600 text-white rounded-xl text-sm">✨</span>
                <div>
                  <h3 class="text-xs font-bold text-slate-900 dark:text-white">Vidya AI Assistant</h3>
                  <p class="text-[9px] text-slate-400">Classroom Analytics &amp; Instant Insights</p>
                </div>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="configureGeminiKey()" class="text-[10px] font-bold text-slate-500 hover:text-indigo-600 px-2 py-1 rounded-lg bg-slate-200 dark:bg-slate-700">
                  ⚙️ API Key
                </button>
                <button onclick="toggleAIChat(false)" class="text-slate-400 hover:text-slate-600 font-bold text-sm p-1">✕</button>
              </div>
            </div>

            <!-- Quick Suggestions -->
            <div class="p-2 px-3 bg-slate-100/50 dark:bg-slate-950/40 border-b border-slate-200 dark:border-slate-800 flex gap-1.5 overflow-x-auto text-[10px] no-scrollbar">
              <button onclick="quickAskAI('Who are the top 3 distinction rankers in the latest test?')" class="whitespace-nowrap px-2.5 py-1 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-medium hover:border-indigo-500">
                🏆 Top 3 Rankers
              </button>
              <button onclick="quickAskAI('Which students have outstanding unpaid fees? List amounts.')" class="whitespace-nowrap px-2.5 py-1 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-medium hover:border-indigo-500">
                💰 Unpaid Fees
              </button>
              <button onclick="quickAskAI('Show attendance rate and list students who have been absent.')" class="whitespace-nowrap px-2.5 py-1 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-medium hover:border-indigo-500">
                📅 Absentee Alert
              </button>
            </div>

            <!-- Messages Stream -->
            <div id="aiMessagesContainer" class="flex-1 p-4 overflow-y-auto space-y-3 text-xs">
              <div class="flex items-start gap-2">
                <div class="p-1 bg-indigo-600 text-white rounded-lg text-xs">🤖</div>
                <div class="bg-slate-100 dark:bg-slate-800 p-3 rounded-2xl rounded-tl-sm text-slate-800 dark:text-slate-200 max-w-[85%] leading-relaxed">
                  Hello! I have full access to your students, tests, marks, attendance, and fee ledgers. Ask me anything like:
                  <br/><br/>
                  <em>"Let me know 1st 3 students in distinction in Unit Test 1"</em>
                </div>
              </div>
            </div>

            <!-- Chat Input Form -->
            <form onsubmit="handleAISend(event)" class="p-3 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex gap-2">
              <input type="text" id="aiInput" placeholder="Ask about marks, top rankers, fees..." required class="flex-1 px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500" />
              <button type="submit" id="aiSendBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow-xs transition">
                Send
              </button>
            </form>
          </div>
        </div>

        <nav class="fixed bottom-0 left-0 right-0 max-w-xl mx-auto bg-white/95 dark:bg-slate-900/95 backdrop-blur border-t border-slate-200 dark:border-slate-800 px-1 py-1.5 flex justify-between items-center z-30 no-print">
          ${navButton('fees', 'Fees', '💰')}
          ${navButton('students', 'Students', '👨‍🎓')}
          ${navButton('attendance', 'Attendance', '📅')}
          ${navButton('academics', 'Marks', '📝')}
          ${navButton('reports', 'Reports', '📊')}
        </nav>
      `;
    }

    function navButton(tabId, label, icon) {
      const active = currentTab === tabId;
      return `
        <button onclick="switchTab('${tabId}')" class="flex-1 flex flex-col items-center py-1 rounded-xl transition ${active ? 'text-indigo-600 font-bold dark:text-indigo-400' : 'text-slate-400 hover:text-slate-600'}">
          <span class="text-base">${icon}</span>
          <span class="text-[9px] mt-0.5">${label}</span>
        </button>
      `;
    }

    window.switchTab = (tabId) => {
      currentTab = tabId;
      renderMainShell();
      loadTabContent();
    };

    window.toggleDarkMode = () => {
      isDarkMode = !isDarkMode;
      localStorage.setItem("vt_dark", isDarkMode);
      document.documentElement.classList.toggle("dark", isDarkMode);
      renderMainShell();
      loadTabContent();
    };

    window.handleLogout = async () => {
      if (sbClient) await sbClient.auth.signOut();
      currentUser = null;
      renderLoginView();
    };

    async function loadTabContent() {
      const content = document.getElementById("tabContent");
      if (!content) return;
      content.innerHTML = `<div class="py-20 text-center text-xs text-slate-400 animate-pulse">Loading module...</div>`;

      if (currentTab === "fees") await renderFeesTab(content);
      if (currentTab === "students") await renderStudentsTab(content);
      if (currentTab === "attendance") await renderAttendanceTab(content);
      if (currentTab === "academics") await renderAcademicsTab(content);
      if (currentTab === "reports") await renderReportsTab(content);
    }

    // ==========================================
    // AI CHATBOT LOGIC (GEMINI API + REAL DATABASE)
    // ==========================================
    window.toggleAIChat = (show) => {
      const drawer = document.getElementById("aiDrawer");
      if (drawer) drawer.classList.toggle("hidden", !show);
    };

    window.configureGeminiKey = () => {
      const current = localStorage.getItem("vt_gemini_key") || "";
      const key = prompt("Enter your Google Gemini API Key (from Google AI Studio):", current);
      if (key !== null) {
        localStorage.setItem("vt_gemini_key", key.trim());
        alert(key.trim() ? "Gemini API Key configured!" : "API Key cleared.");
      }
    };

    window.quickAskAI = (question) => {
      document.getElementById("aiInput").value = question;
      handleAISend(new Event("submit"));
    };

    window.handleAISend = async (e) => {
      if (e) e.preventDefault();
      const input = document.getElementById("aiInput");
      const query = input.value.trim();
      if (!query) return;

      let apiKey = localStorage.getItem("vt_gemini_key");
      if (!apiKey) {
        apiKey = prompt("Please enter your free Google Gemini API Key from Google AI Studio:");
        if (!apiKey) {
          alert("A Gemini API Key is required to power the assistant.");
          return;
        }
        localStorage.setItem("vt_gemini_key", apiKey.trim());
      }

      const container = document.getElementById("aiMessagesContainer");
      const sendBtn = document.getElementById("aiSendBtn");
      input.value = "";
      sendBtn.disabled = true;
      sendBtn.innerText = "Analyzing...";

      // Render User Message
      container.innerHTML += `
        <div class="flex items-start justify-end gap-2">
          <div class="bg-indigo-600 text-white p-3 rounded-2xl rounded-tr-sm max-w-[85%] leading-relaxed">
            ${query}
          </div>
        </div>
      `;
      container.scrollTop = container.scrollHeight;

      // Temporary Loading Indicator
      const loadingId = "ai_load_" + Date.now();
      container.innerHTML += `
        <div id="${loadingId}" class="flex items-start gap-2">
          <div class="p-1 bg-indigo-600 text-white rounded-lg text-xs">🤖</div>
          <div class="bg-slate-100 dark:bg-slate-800 p-3 rounded-2xl rounded-tl-sm text-slate-400 text-xs italic animate-pulse">
            Querying live database & computing metrics...
          </div>
        </div>
      `;
      container.scrollTop = container.scrollHeight;

      try {
        // Fetch Live Database Snapshot
        const [ { data: students }, { data: marks }, { data: attendance }, { data: fees } ] = await Promise.all([
          sbClient.from("students").select("id, name, grade_class, monthly_fee, parent_name, parent_mobile").eq("is_active", true),
          sbClient.from("test_marks").select("student_id, test_name, test_date, subject, min_score, max_score, obtained_score"),
          sbClient.from("attendance").select("student_id, record_date, status"),
          sbClient.from("fees").select("student_id, month_year, amount_due, amount_paid, status")
        ]);

        const dbContext = {
          registered_students: students || [],
          test_marks_records: marks || [],
          attendance_records: attendance || [],
          fee_records: fees || []
        };

        const systemInstructions = `
You are VidyaTrack AI, an intelligent classroom assistant for an educational institution.
You have direct access to the live institutional database provided below in JSON.

Institutional Rules:
1. Distinction is defined as an overall percentage >= 75% in a test (or total obtained score / total max score >= 0.75).
2. Pass is defined as scoring >= min_score in all subjects of that test.
3. Calculate student totals, overall percentages, and rank them precisely.
4. When asked for top rankers or distinction students, list them in clear rank order (1st, 2nd, 3rd) with their exact percentage and subject breakdown.
5. Provide concise, polite, well-formatted answers using bullet points and bold highlights.

Live Database Snapshot:
${JSON.stringify(dbContext)}
`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [
              {
                parts: [
                  { text: systemInstructions },
                  { text: query }
                ]
              }
            ]
          })
        });

        const data = await response.json();
        document.getElementById(loadingId)?.remove();

        if (data.error) {
          throw new Error(data.error.message || "Gemini API rejected the request.");
        }

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response generated.";
        const formattedReply = reply
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.*?)\*/g, '<em>$1</em>')
          .replace(/\n/g, '<br/>');

        container.innerHTML += `
          <div class="flex items-start gap-2">
            <div class="p-1 bg-indigo-600 text-white rounded-lg text-xs">🤖</div>
            <div class="bg-slate-100 dark:bg-slate-800 p-3 rounded-2xl rounded-tl-sm text-slate-800 dark:text-slate-200 max-w-[85%] leading-relaxed">
              ${formattedReply}
            </div>
          </div>
        `;
      } catch (err) {
        document.getElementById(loadingId)?.remove();
        container.innerHTML += `
          <div class="flex items-start gap-2">
            <div class="p-1 bg-rose-600 text-white rounded-lg text-xs">⚠️</div>
            <div class="bg-rose-50 dark:bg-rose-950/50 p-3 rounded-2xl rounded-tl-sm text-rose-600 dark:text-rose-400 text-xs">
              Error: ${err.message}<br/>
              <em>Tip: Check your API Key using the ⚙️ API Key button above.</em>
            </div>
          </div>
        `;
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = "Send";
        container.scrollTop = container.scrollHeight;
      }
    };

    // ==========================================
    // TOOL 1: FEES LEDGER (UNCHANGED)
    // ==========================================
    async function renderFeesTab(container) {
      const currentMonth = new Date().toISOString().slice(0, 7);

      const { data: fees, error } = await sbClient
        .from("fees")
        .select("*, students(name, student_id, parent_mobile, parent_name, grade_class)")
        .order("created_at", { ascending: false });

      if (error) {
        container.innerHTML = `<div class="p-4 bg-rose-50 text-rose-600 text-xs rounded-xl font-mono">${error.message}</div>`;
        return;
      }

      const totalBilled = (fees || []).reduce((acc, f) => acc + parseFloat(f.amount_due || 0), 0);
      const totalCollected = (fees || []).reduce((acc, f) => acc + parseFloat(f.amount_paid || 0), 0);
      const totalPending = totalBilled - totalCollected;

      container.innerHTML = `
        <div class="space-y-4">
          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800">
              <p class="text-[10px] text-slate-400 font-bold uppercase">Billed</p>
              <p class="text-xs font-extrabold text-slate-800 dark:text-white mt-0.5">₹${totalBilled.toLocaleString("en-IN")}</p>
            </div>
            <div class="bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800">
              <p class="text-[10px] text-slate-400 font-bold uppercase">Collected</p>
              <p class="text-xs font-extrabold text-emerald-600 mt-0.5">₹${totalCollected.toLocaleString("en-IN")}</p>
            </div>
            <div class="bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800">
              <p class="text-[10px] text-slate-400 font-bold uppercase">Pending</p>
              <p class="text-xs font-extrabold text-rose-600 mt-0.5">₹${totalPending.toLocaleString("en-IN")}</p>
            </div>
          </div>

          <div class="flex justify-between items-center">
            <h3 class="text-xs font-bold uppercase text-slate-400">Ledger Statements</h3>
            <button onclick="generateMonthlyDues()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-xs">
              ⚡ Generate Invoices (${currentMonth})
            </button>
          </div>

          <div class="space-y-2">
            ${(!fees || fees.length === 0) ? `
              <div class="p-8 text-center text-xs text-slate-400 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800">
                No fee statements found. Tap "Generate Invoices" above.
              </div>
            ` : fees.map(f => {
              const balance = parseFloat(f.amount_due) - parseFloat(f.amount_paid);
              const student = f.students || {};
              const isPaid = f.status === 'Paid';

              return `
                <div class="bg-white dark:bg-slate-900 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-xs space-y-2.5">
                  <div class="flex justify-between items-start">
                    <div>
                      <h4 class="text-xs font-bold text-slate-800 dark:text-slate-100">${student.name || 'Unknown'}</h4>
                      <p class="text-[10px] text-slate-400 font-mono">${student.grade_class || ''} • Cycle: ${f.month_year}</p>
                    </div>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${
                      isPaid ? 'bg-emerald-50 text-emerald-600 dark:bg-emerald-950/50' : 
                      f.status === 'Partial' ? 'bg-amber-50 text-amber-600 dark:bg-amber-950/50' : 
                      'bg-rose-50 text-rose-600 dark:bg-rose-950/50'
                    }">
                      ${f.status}
                    </span>
                  </div>

                  <div class="flex justify-between items-center text-xs pt-1 border-t border-slate-100 dark:border-slate-800">
                    <div>
                      <span class="font-extrabold text-slate-800 dark:text-slate-200">₹${parseFloat(f.amount_paid).toLocaleString("en-IN")}</span>
                      <span class="text-[11px] text-slate-400">/ ₹${parseFloat(f.amount_due).toLocaleString("en-IN")}</span>
                      ${balance > 0 ? `<span class="block text-[10px] text-rose-500 font-bold">Due: ₹${balance.toLocaleString("en-IN")}</span>` : ''}
                    </div>

                    <div class="flex gap-1.5 items-center">
                      ${!isPaid ? `
                        <button onclick="openPaymentModal('${f.id}', ${f.amount_due}, ${f.amount_paid})" class="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-[10px] font-bold">
                          Collect
                        </button>
                      ` : ''}

                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Test Date *</label>
                    <input type="date" id="multiTestDate" value="${new Date().toISOString().split('T')[0]}" required class="w-full p-2 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 outline-none" />
                  </div>
                </div>

                <div class="border-t border-slate-200 dark:border-slate-800 pt-2">
                  <div class="flex justify-between items-center mb-1">
                    <span class="text-[10px] font-bold text-slate-400 uppercase">Subjects List</span>
                    <button type="button" onclick="addSubjectRow()" class="text-[10px] font-bold text-indigo-600 hover:text-indigo-700">+ Add Subject</button>
                  </div>
                  
                  <div id="subjectRowsContainer" class="space-y-2">
                    <div class="subject-row bg-slate-50 dark:bg-slate-800/60 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 grid grid-cols-12 gap-1.5 items-center">
                      <div class="col-span-5">
                        <input type="text" placeholder="Subject Name" required class="sub-name w-full p-1.5 bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 text-xs outline-none" />
                      </div>
                      <div class="col-span-2">
                        <input type="number" placeholder="Min" value="35" required class="sub-min w-full p-1.5 bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 text-xs outline-none text-center" />
                      </div>
                      <div class="col-span-2">
                        <input type="number" placeholder="Max" value="100" required class="sub-max w-full p-1.5 bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 text-xs outline-none text-center" />
                      </div>
                      <div class="col-span-2">
                        <input type="number" step="0.5" placeholder="Obtained" required class="sub-obtained w-full p-1.5 bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 text-xs outline-none text-center font-bold text-indigo-600" />
                      </div>
                      <div class="col-span-1 text-center">
                        <button type="button" onclick="removeSubjectRow(this)" class="text-rose-500 font-bold text-xs">✕</button>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="flex gap-2 pt-2 border-t border-slate-200 dark:border-slate-800">
                  <button type="button" onclick="toggleTestEntryModal(false)" class="flex-1 py-2 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 rounded-xl font-bold">Cancel</button>
                  <button type="submit" class="flex-1 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow-xs">Save Test</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      `;
    }
window.addSubjectRow = () => {
      const c = document.getElementById("subjectRowsContainer");
      const row = document.createElement("div");
      row.className = "subject-row bg-slate-50 dark:bg-slate-800/60 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 grid grid-cols-12 gap-1.5 items-center";
      row.innerHTML = `
        <div class="col-span-5">
          <input type="text" placeholder="Subject Name" required class="sub-name w-full p-1.5 bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 text-xs outline-none" />
        </div>
        <div class="col-span-2">
          <input type="number" placeholder="Min" value="35" required class="sub-min w-full p-1.5 bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 text-xs outline-none text-center" />
        </div>
        <div class="col-span-2">
          <input type="number" placeholder="Max" value="100" required class="sub-max w-full p-1.5 bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 text-xs outline-none text-center" />
        </div>
        <div class="col-span-2">
          <input type="number" step="0.5" placeholder="Obtained" required class="sub-obtained w-full p-1.5 bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 text-xs outline-none text-center font-bold text-indigo-600" />
        </div>
        <div class="col-span-1 text-center">
          <button type="button" onclick="removeSubjectRow(this)" class="text-rose-500 font-bold text-xs">✕</button>
        </div>
      `;
      c.appendChild(row);
    };

    window.removeSubjectRow = (btn) => {
      const rows = document.querySelectorAll(".subject-row");
      if (rows.length > 1) {
        btn.closest(".subject-row").remove();
      } else {
        alert("A test must have at least one subject.");
      }
    };

    window.saveMultiSubjectTest = async (e) => {
      e.preventDefault();
      const studentId = document.getElementById("multiStudentId").value;
      const testName = document.getElementById("multiTestName").value.trim();
      const testDate = document.getElementById("multiTestDate").value;

      const rows = document.querySelectorAll(".subject-row");
      const records = [];

      rows.forEach(r => {
        const subName = r.querySelector(".sub-name").value.trim();
        const minVal = parseFloat(r.querySelector(".sub-min").value) || 35;
        const maxVal = parseFloat(r.querySelector(".sub-max").value) || 100;
        const obtainedVal = parseFloat(r.querySelector(".sub-obtained").value) || 0;

        if (subName) {
          records.push({
            student_id: studentId,
            test_name: testName,
            test_date: testDate,
            subject: subName,
            min_score: minVal,
            max_score: maxVal,
            obtained_score: obtainedVal
          });
        }
      });

      if (records.length === 0) {
        alert("Please specify at least one subject.");
        return;
      }

      const { error } = await sbClient.from("test_marks").upsert(records, { onConflict: "student_id,test_name,subject" });

      if (error) {
        alert("Error saving test marks: " + error.message);
        return;
      }

      alert(`Test '${testName}' with ${records.length} subjects saved successfully!`);
      toggleTestEntryModal(false);
      loadTabContent();
    };

    // ==========================================
    // TOOL 5: ADVANCED COMPREHENSIVE REPORTS (UNCHANGED)
    // ==========================================
    let currentReportPayload = null;

    async function renderReportsTab(container) {
      const { data: students } = await sbClient.from("students").select("id, name, grade_class").eq("is_active", true).order("name");

      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex justify-between items-center no-print">
            <h3 class="text-xs font-bold uppercase text-slate-400">Generate Student Progress Card</h3>
          </div>

          <div class="bg-white dark:bg-slate-900 p-3 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-xs flex gap-2 items-center no-print">
            <select id="reportStudentSelect" class="flex-1 p-2 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 text-xs outline-none">
              ${(students || []).map(s => `<option value="${s.id}">${s.name} (${s.grade_class})</option>`).join("")}
            </select>
            <button onclick="renderSelectedReport()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold">Generate</button>
          </div>

          <div id="reportSheetContainer"></div>
        </div>
      `;

      if (students && students.length > 0) renderSelectedReport();
    }

    window.renderSelectedReport = async () => {
      const sel = document.getElementById("reportStudentSelect");
      const target = document.getElementById("reportSheetContainer");
      if (!sel || !sel.value) return;

      const studentId = sel.value;
      target.innerHTML = `<div class="py-12 text-center text-xs text-slate-400 animate-pulse">Aggregating live student records from Supabase...</div>`;

      const { data: student, error: stuErr } = await sbClient.from("students").select("*").eq("id", studentId).single();
      if (stuErr || !student) {
        target.innerHTML = `<div class="p-4 text-rose-500 text-xs">Student record not found.</div>`;
        return;
      }

      const { data: fees } = await sbClient.from("fees").select("*").eq("student_id", studentId).order("month_year", { ascending: false });
      const totalBilled = (fees || []).reduce((sum, f) => sum + parseFloat(f.amount_due || 0), 0);
      const totalPaid = (fees || []).reduce((sum, f) => sum + parseFloat(f.amount_paid || 0), 0);
      const feeBalance = totalBilled - totalPaid;

      const currentMonth = new Date().toISOString().slice(0, 7);
      const { data: attendance } = await sbClient.from("attendance").select("*").eq("student_id", studentId);
      const monthAtt = (attendance || []).filter(a => a.record_date && a.record_date.startsWith(currentMonth));
      const totalMonthDays = monthAtt.length;
      const monthPresent = monthAtt.filter(a => a.status === 'Present').length;
      const monthAbsent = monthAtt.filter(a => a.status === 'Absent').length;
      const attendanceRate = totalMonthDays > 0 ? ((monthPresent / totalMonthDays) * 100).toFixed(1) : "N/A";

      const { data: testMarks } = await sbClient
        .from("test_marks")
        .select("*")
        .eq("student_id", studentId)
        .order("created_at", { ascending: true });

      const testGroups = {};
      (testMarks || []).forEach(m => {
        if (!testGroups[m.test_name]) {
          testGroups[m.test_name] = {
            testName: m.test_name,
            testDate: m.test_date,
            subjects: []
          };
        }
        testGroups[m.test_name].subjects.push(m);
      });

      currentReportPayload = {
        student,
        fees: { totalBilled, totalPaid, feeBalance, list: fees || [] },
        attendance: { currentMonth, totalMonthDays, monthPresent, monthAbsent, attendanceRate },
        tests: Object.values(testGroups)
      };

      target.innerHTML = `
        <div class="space-y-4">
          <div class="flex flex-wrap gap-2 justify-end no-print">
            <button onclick="sendReportWhatsApp()" class="flex items-center gap-1.5 px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-xs">
              <span>💬</span> Push via WhatsApp
            </button>
            <button onclick="downloadReportCSV()" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-700 hover:bg-slate-800 text-white rounded-xl text-xs font-bold shadow-xs">
              <span>📥</span> Download CSV
            </button>
            <button onclick="window.print()" class="flex items-center gap-1.5 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-xs">
              <span>🖨️</span> Print / Save PDF
            </button>
          </div>

          <div id="printReportArea" class="bg-white text-slate-900 p-6 rounded-3xl shadow-sm border border-slate-200 space-y-6">
            <div class="text-center border-b border-slate-300 pb-3">
              <h1 class="text-xl font-black uppercase tracking-wider text-indigo-900">VidyaTrack Academy</h1>
              <p class="text-[10px] text-slate-500 uppercase tracking-widest mt-0.5">Comprehensive Student Progress &amp; Standing Report</p>
            </div>

            <div class="grid grid-cols-2 gap-2 text-xs border-b border-slate-100 pb-3">
              <div>
                <p class="text-slate-500 text-[10px] uppercase font-bold">Student Details</p>
                <p class="font-extrabold text-sm text-slate-900">${student.name}</p>
                <p class="text-slate-600">${student.grade_class} • ID: ${student.student_id || 'N/A'}</p>
              </div>
              <div class="text-right">
                <p class="text-slate-500 text-[10px] uppercase font-bold">Parent / Guardian</p>
                <p class="font-bold text-slate-800">${student.parent_name || 'N/A'}</p>
                <p class="text-slate-600">${student.parent_mobile || 'N/A'}</p>
                <p class="text-[10px] text-slate-400 mt-1 font-mono">Date: ${new Date().toLocaleDateString('en-IN')}</p>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200">
                <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block">Monthly Attendance (${currentMonth})</span>
                <div class="flex justify-between items-baseline mt-1">
                  <span class="text-base font-black text-indigo-700">${attendanceRate === "N/A" ? 'N/A' : attendanceRate + '%'}</span>
                  <span class="text-[10px] text-slate-500">${monthPresent} Present / ${monthAbsent} Absent</span>
                </div>
              </div>

              <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200">
                <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block">Fee Standing</span>
                <div class="flex justify-between items-baseline mt-1">
                  <span class="text-base font-black ${feeBalance > 0 ? 'text-rose-600' : 'text-emerald-600'}">
                    ₹${feeBalance > 0 ? feeBalance.toLocaleString("en-IN") + ' Due' : 'Paid in Full'}
                  </span>
                  <span class="text-[10px] text-slate-500">Paid: ₹${totalPaid.toLocaleString("en-IN")}</span>
                </div>
              </div>
            </div>

            <div class="space-y-4">
              <h4 class="text-xs font-black uppercase tracking-wider text-slate-700 border-b border-slate-200 pb-1">
                Academic Performance (Recorded Tests)
              </h4>

              ${currentReportPayload.tests.length === 0 ? `
                <div class="p-4 text-center text-xs text-slate-400 bg-slate-50 rounded-xl border border-slate-100">
                  No examination marks recorded for this student in the Marks tab.
                </div>
              ` : currentReportPayload.tests.map(t => {
                const totalObtained = t.subjects.reduce((sum, s) => sum + parseFloat(s.obtained_score || 0), 0);
                const totalMax = t.subjects.reduce((sum, s) => sum + parseFloat(s.max_score || 100), 0);
                const pct = totalMax > 0 ? ((totalObtained / totalMax) * 100).toFixed(1) : 0;
                const hasFailed = t.subjects.some(s => parseFloat(s.obtained_score) < parseFloat(s.min_score));

                return `
                  <div class="border border-slate-200 rounded-xl overflow-hidden">
                    <div class="bg-slate-100 px-3 py-2 flex justify-between items-center text-xs font-bold">
                      <div>
                        <span>${t.testName}</span>
                        <span class="text-[10px] text-slate-500 font-normal ml-1">(${t.testDate || 'N/A'})</span>
                      </div>
                      <span class="${hasFailed ? 'text-rose-600' : 'text-emerald-600'}">
                        ${hasFailed ? 'Failed' : 'Passed'} • ${pct}%
                      </span>
                    </div>

                    <table class="w-full text-left text-xs border-collapse">
                      <thead>
                        <tr class="bg-slate-50 text-slate-500 text-[9px] uppercase border-b border-slate-200 font-bold">
                          <th class="p-2">Subject</th>
                          <th class="p-2 text-center">Min Score</th>
                          <th class="p-2 text-center">Max Score</th>
                          <th class="p-2 text-center">Obtained</th>
                          <th class="p-2 text-right">Result</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-slate-100">
                        ${t.subjects.map(sub => {
                          const isPass = parseFloat(sub.obtained_score) >= parseFloat(sub.min_score);
                          return `
                            <tr>
                              <td class="p-2 font-semibold text-slate-800">${sub.subject}</td>
                              <td class="p-2 text-center text-slate-500">${sub.min_score}</td>
                              <td class="p-2 text-center text-slate-500">${sub.max_score}</td>
                              <td class="p-2 text-center font-bold text-slate-900">${sub.obtained_score}</td>
                              <td class="p-2 text-right font-bold text-[10px] ${isPass ? 'text-emerald-600' : 'text-rose-600'}">
                                ${isPass ? 'Pass' : 'Fail'}
                              </td>
                            </tr>
                          `;
                        }).join("")}
                        <tr class="bg-slate-50/70 font-extrabold text-slate-900">
                          <td class="p-2 text-right">TOTAL</td>
                          <td class="p-2 text-center text-slate-400">-</td>
                          <td class="p-2 text-center">${totalMax}</td>
                          <td class="p-2 text-center text-indigo-700">${totalObtained}</td>
                          <td class="p-2 text-right text-indigo-700">${pct}%</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                `;
              }).join("")}
            </div>

            <div class="pt-10 flex justify-between items-end text-xs text-slate-700">
              <div class="border-t border-slate-400 w-32 text-center pt-1 font-semibold">Class Teacher</div>
              <div class="border-t border-slate-400 w-32 text-center pt-1 font-semibold">Principal</div>
            </div>

          </div>
        </div>
      `;
    };
window.sendReportWhatsApp = () => {
      if (!currentReportPayload) return;
      const { student, fees, attendance, tests } = currentReportPayload;

      if (!student.parent_mobile || student.parent_mobile.trim() === "") {
        alert("No mobile number registered for this parent.");
        return;
      }

      const cleanMobile = student.parent_mobile.replace(/[^0-9]/g, "").slice(-10);

      let testText = "";
      if (tests.length === 0) {
        testText = "No test records found.";
      } else {
        tests.forEach(t => {
          const totalObt = t.subjects.reduce((sum, s) => sum + parseFloat(s.obtained_score || 0), 0);
          const totalMax = t.subjects.reduce((sum, s) => sum + parseFloat(s.max_score || 100), 0);
          const pct = totalMax > 0 ? ((totalObt / totalMax) * 100).toFixed(1) : 0;
          const status = t.subjects.some(s => parseFloat(s.obtained_score) < parseFloat(s.min_score)) ? "Needs Improvement ⚠️" : "Passed ✅";

          testText += `\n*${t.testName}* (${status})\n• Score: ${totalObt}/${totalMax} (${pct}%)\n`;
          t.subjects.forEach(sub => {
            const isPass = parseFloat(sub.obtained_score) >= parseFloat(sub.min_score);
            testText += `  - ${sub.subject}: ${sub.obtained_score}/${sub.max_score} (${isPass ? 'Pass' : 'Fail'})\n`;
          });
        });
      }

      const message = 
`*VIDYATRACK ACADEMY - PROGRESS REPORT*
----------------------------------------
*Student:* ${student.name} (${student.grade_class})
*Parent:* ${student.parent_name || 'Parent'}
*Report Date:* ${new Date().toLocaleDateString('en-IN')}

📅 *MONTHLY ATTENDANCE (${attendance.currentMonth})*
• Days Recorded: ${attendance.totalMonthDays}
• Present: ${attendance.monthPresent} days
• Absent: ${attendance.monthAbsent} days
• Attendance Rate: ${attendance.attendanceRate === "N/A" ? 'N/A' : attendance.attendanceRate + '%'}

📝 *ACADEMIC EXAM PERFORMANCE*
${testText}
💰 *FEE STATUS*
• Total Billed: ₹${fees.totalBilled.toLocaleString("en-IN")}
• Total Paid: ₹${fees.totalPaid.toLocaleString("en-IN")}
• Outstanding Due: ₹${fees.feeBalance.toLocaleString("en-IN")} ${fees.feeBalance > 0 ? '⚠️' : '✅'}

Kindly review your child's progress report. Thank you!`;

      window.open("https://wa.me/91" + cleanMobile + "?text=" + encodeURIComponent(message), "_blank");
    };

    window.downloadReportCSV = () => {
      if (!currentReportPayload) return;
      const { student, fees, attendance, tests } = currentReportPayload;

      let csv = `VIDYATRACK ACADEMY PROGRESS REPORT\n`;
      csv += `Student Name,${student.name}\n`;
      csv += `Class / Grade,${student.grade_class}\n`;
      csv += `Parent Name,${student.parent_name || ''}\n`;
      csv += `Parent Mobile,${student.parent_mobile || ''}\n`;
      csv += `Report Date,${new Date().toISOString().split('T')[0]}\n\n`;

      csv += `ATTENDANCE SUMMARY (${attendance.currentMonth})\n`;
      csv += `Total Days Recorded,${attendance.totalMonthDays}\n`;
      csv += `Present Days,${attendance.monthPresent}\n`;
      csv += `Absent Days,${attendance.monthAbsent}\n`;
      csv += `Attendance Percentage,${attendance.attendanceRate}%\n\n`;

      csv += `FEE SUMMARY\n`;
      csv += `Total Billed,${fees.totalBilled}\n`;
      csv += `Total Paid,${fees.totalPaid}\n`;
      csv += `Balance Due,${fees.feeBalance}\n\n`;

      csv += `ACADEMIC TEST DETAILS\n`;
      csv += `Test Name,Date,Subject,Min Score,Max Score,Obtained Score,Result\n`;

      tests.forEach(t => {
        t.subjects.forEach(sub => {
          const res = parseFloat(sub.obtained_score) >= parseFloat(sub.min_score) ? 'Pass' : 'Fail';
          csv += `"${t.testName}","${t.testDate || ''}","${sub.subject}",${sub.min_score},${sub.max_score},${sub.obtained_score},${res}\n`;
        });
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `${student.name.replace(/\s+/g, '_')}_Progress_Report.csv`;
      link.click();
    };

    function startApp() {
      if (sbClient) {
        sbClient.auth.onAuthStateChange(async (_, session) => {
          currentUser = session ? session.user : null;
          if (currentUser) currentUserRole = await fetchUserRole(currentUser.id);
          if (!currentUser) renderLoginView();
          else {
            renderMainShell();
            loadTabContent();
          }
        });

        sbClient.auth.getSession().then(async ({ data: { session } }) => {
          currentUser = session ? session.user : null;
          if (currentUser) currentUserRole = await fetchUserRole(currentUser.id);
          if (!currentUser) renderLoginView();
          else {
            renderMainShell();
            loadTabContent();
          }
        });
      } else {
        renderLoginView();
      }
    }

    startApp();
  </script>
</body>
</html>
